# ============================================================
# HiveMtk 用户端 - 宿主机部署版 Docker Compose（仅数据层）
# ------------------------------------------------------------
# 部署定位（2026-08-17 重构）：
#   - Docker 只负责提供数据库：PostgreSQL(user_db) + Redis
#   - user-server（Go 代码）在【宿主机】运行，不再容器化
#   - 本地推理栈（LLM / Embedding / Rerank）由宿主机 llama.cpp / MLX 直接运行
#     （见 scripts/inference-host/），容器不再承载推理
#   - 前端（user-web）与嵌入 SDK（embed-sdk）在【宿主机】构建后由 user-server 直接托管
#   - 用户端由各商户/用户自行部署，与【平台端】物理隔离
#
# 端口（权威文档：docs/PORT_REGISTRY.md §一 端口对照表）：
#   - mtk-postgres：容器内**固定 8202** → 宿主机映射 ${USER_POSTGRES_HOST_PORT:-8202}
#     · 默认值 8202；开发时可在 .env 设 USER_POSTGRES_HOST_PORT=8232 避开 8202（历史其他服务占用）
#     · 两种模式：Docker 数据层（ports.go DefaultDBPortDocker=8202）vs 宿主机直连（DefaultDBPortDev=8232）
#   - mtk-redis  ：容器内 8203 → 宿主机 127.0.0.1:${REDIS_HOST_PORT:-8203}
#   - LLM        ：宿主机 127.0.0.1:8207（llama-server / mlx_lm.server，scripts/inference-host/start-llm.sh）
#   - Embedding  ：宿主机 127.0.0.1:8208（llama-server，scripts/inference-host/start-embedding.sh）
#   - Rerank     ：宿主机 127.0.0.1:8209（llama-server，scripts/inference-host/start-rerank.sh）
# 改端口流程：docs/PORT_REGISTRY.md §3.2 — 严禁随意改！改完跑 bash scripts/audit-cross-package-ports.sh
#
# 启动：
#   docker compose up -d
# 停止：
#   docker compose down
# 一键全栈（PG+Redis+推理+user-server+user-web）：
#   make dev-all
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"
    labels: "service,environment"

networks:
  mtk-user-network:
    name: mtk_user_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16

volumes:
  mtk_user_pg_data:
    name: mtk_user_pg_data
  mtk_user_redis_data:
    name: mtk_user_redis_data

services:
  # ============================================================
  # 用户端 PostgreSQL 15+ + pgvector（独立容器，库名 user_db）
  # ============================================================
  mtk-postgres:
    image: pgvector/pgvector:pg15
    container_name: mtk-postgres
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (use: openssl rand -hex 24)}"
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
    command:
      - postgres
      - -c
      - shared_preload_libraries=vector,pg_stat_statements
      - -c
      - max_connections=500
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - port=8202
    # 端口：绑 127.0.0.1（只本机可访问）。默认宿主机 8202，可通过 .env 的
    # USER_POSTGRES_HOST_PORT 覆盖。开发时建议覆盖到 8232 避开 8202 历史占用。
    # 详见 docs/PORT_REGISTRY.md §二 模式说明
    ports:
      - "127.0.0.1:${USER_POSTGRES_HOST_PORT:-8202}:8202"
    volumes:
      - mtk_user_pg_data:/var/lib/postgresql/data
      - ./migrations/init-user-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      mtk-user-network:
        aliases:
          - mtk-postgres
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-admin} -d ${USER_DB_NAME:-user_db} -p 8202
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    # G-3 容器加固（保守子集：不改首启语义。cap_drop: ALL 需先验证官方镜像
    # entrypoint 的 chown/gosu 依赖，留待一次性环境验证后补，见清单 G-3）
    security_opt:
      - no-new-privileges:true
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================================
  # Redis 缓存
  # ============================================================
  mtk-redis:
    image: redis:7-alpine
    container_name: mtk-redis
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required (>=32 chars). Generate with: openssl rand -hex 32}"
    command:
      - redis-server
      - --port
      - "8203"
      - --appendonly
      - "yes"
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required (>=32 chars). Generate with: openssl rand -hex 32}"
    # 关键：端口绑到 127.0.0.1
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-8203}:8203"
    volumes:
      - mtk_user_redis_data:/data
    networks:
      mtk-user-network:
        aliases:
          - mtk-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 8203 -a \"$REDIS_PASSWORD\" ping >/dev/null 2>&1 || redis-cli -p 8203 ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # G-3 容器加固（同 mtk-postgres 口径的保守子集）
    security_opt:
      - no-new-privileges:true
    init: true
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
