# ============================================================
# 【固定凭据标记 - 禁止修改】
# admin 账号密码: admin / Seed@123456
# 更新时间: 2026-09-01 (bcrypt $2a$10$yyJ9iTVx5WkJulTHFWO1nufMhkDyrA3pAbx381DJXxei8UDLh3WUG)
# 来源: cmd/seed/seed_users.go seedPassword 常量
# 后续不得修改此密码 — 如需新用户请走 /api/auth/register 或创建新 seed 脚本
# ============================================================

platform_api:
  # 平台端 API 网关（user-server 与 platform-server 均跑在宿主机，本机回环访问）
  # 单一源：internal/config/ports.go → DefaultPlatformPort=8205
  # 文档源：DEVELOPMENT.md §2.4 + docker-compose.yml 中 postgres-platform 端口映射
  # 调整流程：先改 ports.go 常量 → 同步本字段 → 同步 docker-compose.yml
  # 覆盖优先级：环境变量 PLATFORM_API_URL > 本默认值
  # 字段名统一为 api_url（与 internal/config/platform.go LoadPlatform / server.go PlatformAPI 一致）
  api_url: "${PLATFORM_API_URL:http://127.0.0.1:8205}"

# 外部可达基座 URL（用于自动推导 Telegram / 飞书 / 钉钉等被动渠道的 Webhook 回调地址）
# 背景：user-server 部署在反代/frp/云函数之后，渠道回调所需的公网 URL
#       无法从「请求 Host 头」直接推断（默认会得到 localhost:8204，
#       Telegram 无法向其投递消息）。显式声明后，注册 webhook 时优先使用该地址。
# 覆盖优先级（自高到低）：
#   1. 环境变量 PUBLIC_BASE_URL（部署期单点覆盖，无需改文件）
#   2. 本字段 external.public_base_url
#   3. X-Forwarded-Proto / X-Forwarded-Host 反代透传
#   4. 请求自身 Host（仅适合公网直连调试）
# 格式要求：
#   - scheme + host（不含 path），如 https://shop.example.com 或 https://example.com:8443
#   - 必须是 https（Telegram / 飞书强制 https；本系统会自动把 http+端口 升级为 https）
#   - 不带尾部斜杠
# 留空 → 自动降级到 polling 模式（无需公网域名，但禁止水平扩展，仅适合开发 / 单实例）
external:
  public_base_url: "${PUBLIC_BASE_URL:}"

# 统一日志系统配置（生产建议 json + both，便于日志采集与本地排障）

# ============================================================
# 安全配置
# ============================================================
security:
  jwt_secret: "${USER_JWT_SECRET:your-super-secret-jwt-key-at-least-32-chars-long}"
  visitor_token_secret: "${VISITOR_TOKEN_SECRET:}"

logging:
  level: "info"
  format: "json"
  output: "both"
  file: "logs/user-server.log"
  max_size: 200
  component: "user-server"

# ============================================================
# 数据库配置（配置文件唯一保留的运行时配置）
# ============================================================
# 私域合规基线 §7.2：密码不落配置文件。docker 部署时由 .env 注入，
# 宿主机运行时由环境变量 DB_PASSWORD 注入，app 启动直接读取。
# 端口说明：DB_PORT 默认 8232（宿主机直连 Dev 模式，避开 8202 历史占用）；
#           Docker 数据层模式通过 .env DB_PORT=8202 覆盖。
#           权威端口表 + 改端口流程 → docs/PORT_REGISTRY.md
database:
  type: postgres
  postgres:
    host: "${DB_HOST:127.0.0.1}"
    port: ${DB_PORT:8232}
    user: admin
    dbname: user_db
    sslmode: disable

vector_database:
  type: pgvector
  pgvector:
    table: knowledge_embeddings
    # 2026-07-24：本地 llama.cpp + bge-m3（1024 维），与 pgvector vector(1024) 对齐
    dimension: 1024

# ============================================================
# LLM / 推理栈配置
# ============================================================
# 设计原则（2026-08-17 重构）：
#   - 本节提供本地推理栈（llama.cpp / MLX）的回落默认值，必须与
#     internal/config/server.go DefaultInferenceConfig() 严格一致（测试断言）。
#   - LLM 运行时配置（提供商 / base_url / model / api_key / temperature 等）通过
#     后台「LLM 路由」页面 → POST /api/llm/models 写入数据库表 llm_providers，
#     user-server 启动时经 LoadProvidersFromDB 加载，覆盖本节默认值。
#   - 合规基线：API Key 不落配置文件；cloud_providers 必须为空（禁止云端 fallback）。
#   - 场景路由规则持久化到 llm_routing_rules 表，由 /api/llm/scene-routing 管理。
inference:
  profile: dev
  embedding:
    mode: local
    base_url: "http://127.0.0.1:8208/v1"
    model: "bge-m3"
    dimension: 1024
    allow_fallback: false
  rerank:
    mode: local
    base_url: "http://127.0.0.1:8209/v1"
    model: "bge-reranker-v2-m3"
    enabled: true
  llm:
    mode: local
    base_url: "http://127.0.0.1:8207/v1"
    model: "qwen2.5-7b-instruct-q4_k_m"
    temperature: 0.7
    max_tokens: 1024
    timeout_seconds: 720
    max_retries: 1
    primary_provider: ""
    api_key: ""
    cloud_providers: []

# ============================================================
# 对象存储配置（密钥通过环境变量注入，不落配置文件）
# ============================================================
# 七牛云 AK/SK 由 QINIU_ACCESS_KEY / QINIU_SECRET_KEY 环境变量提供。
storage:
  type: qiniu
  qiniu:
    access_key: ""
    secret_key: ""
    bucket: ""
    domain: ""

# 多语言方案配置（v1.2 出海多语言 P1-2）
# 低资源语言（ar/th/vi/hi/tr）LLM 输出质量不稳定，启用后走 DeepL 翻译降级路径：
#   中文 RAG 生成 → DeepL 翻译 → Glossary 后处理校准
# 默认关闭：enabled=false 时不影响主流程，走标准跨语言 LLM 生成路径。
# 启用条件：enabled=true 且 DEEPL_API_KEY 环境变量已配置。
i18n:
  fallback:
    enabled: false                          # 总开关，默认关闭
    low_resource_langs: ["ar", "th", "vi", "hi", "tr"]  # 低资源语言列表
    translator: deepl                       # 翻译引擎（当前仅支持 deepl）
    deepl:
      # DeepL API key 通过环境变量注入（合规基线 §7.2 敏感数据脱敏）
      # 未设置时 FallbackBridge 自动禁用；Free 版需同步改 base_url 为 https://api-free.deepl.com/v2
      api_key: "${DEEPL_API_KEY}"
      base_url: "https://api.deepl.com/v2"
