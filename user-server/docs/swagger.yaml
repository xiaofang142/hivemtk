  /api/webhook/{channel}/{account_id}:
    post:
      consumes:
      - application/json
      description: 通用渠道回调入口，按 channel 路由到不同处理逻辑
      parameters:
      - description: 渠道：wechat/wecom/douyin/xiaohongshu/email
        in: path
        name: channel
        required: true
        type: string
      - description: 账号 ID
        in: path
        name: account_id
        required: true
        type: string
      - description: 渠道原始 payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 处理成功
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 接收渠道 Webhook 回调
      tags:
      - Webhook
  /api/webhook/feishu/{account_id}:
    get:
      description: 飞书事件订阅 URL 配置时调用，回显 challenge 完成验证
      parameters:
      - description: 账号 ID
        in: path
        name: account_id
        required: true
        type: string
      - description: 飞书 challenge
        in: query
        name: challenge
        required: true
        type: string
      - description: VerificationToken
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 验证通过
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 飞书回调 URL 验证
      tags:
      - Webhook
  /api/webhook/whatsapp/{account_id}:
    get:
      description: Meta 配置 Webhook 时调用，校验 verify_token 后回显 challenge
      parameters:
      - description: 账号 ID
        in: path
        name: account_id
        required: true
        type: string
      - description: 固定 subscribe
        in: query
        name: hub.mode
        required: true
        type: string
      - description: 校验 token
        in: query
        name: hub.verify_token
        required: true
        type: string
      - description: 回显 challenge
        in: query
        name: hub.challenge
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: challenge
          schema:
            type: string
      summary: WhatsApp Cloud 回调 URL 验证
      tags:
      - Webhook
