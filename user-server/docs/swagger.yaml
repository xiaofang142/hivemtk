      top_1_hit_rate:
        type: number
      top_k_hit_rate:
        type: number
      total_queries:
        type: integer
      window_end:
        type: string
      window_start:
        type: string
      zero_hit_count:
        type: integer
    type: object
  hivemtk-user_internal_service.RecallMetrics:
    properties:
      avg_latency_ms:
        type: number
      avg_precision:
        type: number
      avg_recall:
        type: number
      low_recall_count:
        type: integer
      p99_latency_ms:
        type: integer
      total_queries:
        type: integer
      window_end:
        type: string
      window_start:
        type: string
      zero_hit_count:
        type: integer
    type: object
  hivemtk-user_internal_service.RegisterRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 64
        minLength: 8
        type: string
      phone:
        type: string
      real_name:
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  hivemtk-user_internal_service.RequestPasswordResetRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  hivemtk-user_internal_service.ResetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  hivemtk-user_internal_service.SopHeatmapReport:
    properties:
      generated_at:
        type: string
      nodes:
        items:
          $ref: '#/definitions/hivemtk-user_internal_service.NodeHeatmapEntry'
        type: array
      sop_id:
        type: integer
      sop_name:
        type: string
      total_executions:
        type: integer
      variant:
        type: string
    type: object
  internal_controller.AddBlacklistRequest:
    properties:
      domain:
        type: string
      platform:
        type: string
      reason:
        type: string
      source:
        type: string
      ttl_hours:
        type: integer
    required:
    - domain
    type: object
  internal_controller.BatchRecognizeRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_controller.RecognizeRequest'
        type: array
      messages:
        items:
          type: string
        type: array
    type: object
  internal_controller.CollectRequest:
    properties:
      window_seconds:
        type: integer
    type: object
  internal_controller.RecognizeRequest:
    properties:
      context:
        type: string
      customer_id:
        type: string
      message:
        type: string
      platform:
        type: string
      session_id:
        type: string
      text:
        type: string
    type: object
  internal_controller.WebhookRequest:
    properties:
      carrier:
        type: string
      deliveredAt:
        type: string
      errorCode:
        type: string
      errorMsg:
        type: string
      jobId:
        type: string
      messageId:
        type: string
      phone:
        type: string
      provider:
        type: string
      sentAt:
        type: string
      status:
        type: string
    required:
    - messageId
    - phone
    type: object
  internal_controller.faqCreateReq:
    properties:
      agent_id:
        type: integer
      answer:
        type: string
      category:
        type: string
      confidence:
        type: number
      enabled:
        type: boolean
      intent:
        type: string
      keywords:
        items:
          type: string
        type: array
      question:
        type: string
    required:
    - agent_id
    - answer
    - question
    type: object
  internal_controller.mergeRequest:
    properties:
      primary_id:
        type: string
      secondary_id:
        type: string
    required:
    - primary_id
    - secondary_id
    type: object
  internal_service.MergeRule:
    properties:
      built_in:
        type: boolean
      description:
        type: string
      enabled:
        type: boolean
      example:
        type: string
      field:
        type: string
      id:
        type: integer
      name:
        type: string
      op:
        type: string
      priority:
        type: integer
      updated_at:
        type: string
      value:
        type: string
    type: object
  internal_service.MergeRuleSet:
    properties:
      built_in:
        items:
          $ref: '#/definitions/internal_service.MergeRule'
        type: array
      custom:
        items:
          $ref: '#/definitions/internal_service.MergeRule'
        type: array
      strategy:
        $ref: '#/definitions/internal_service.MergeStrategy'
      updated_at:
        type: string
    type: object
  internal_service.MergeStrategy:
    properties:
      conflict_behavior:
        type: string
      post_merge_actions:
        items:
          type: string
        type: array
      primary_rule:
        type: string
      window_end:
        type: string
      window_start:
        type: string
    type: object
info:
  contact: {}
  description: |-
    HiveMtk 用户端（私域独立部署）RESTful API。认证采用 JWT：请求头 Authorization: Bearer <token>。
    仅当 ENABLE_SWAGGER=true 时，通过 http://localhost:8204/swagger/index.html 本地访问。
  title: HiveMtk 用户端 API
  version: 3.41.0
paths:
  /api/ai-agents:
    get:
      consumes:
      - application/json
      description: 分页/筛选查询 AI 智能体
      parameters:
      - description: 类型：sales/sop/faq
        in: query
        name: type
        type: string
      - description: 状态：1-启用 0-禁用
        in: query
        name: status
        type: integer
      - description: 关键词
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: AI 智能体列表
      tags:
      - AI Agent
  /api/ai-agents-enabled:
    get:
      description: 仅返回启用状态的智能体，用于前台展示
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 启用的 AI 智能体列表
      tags:
      - AI Agent
  /api/ai-agents/{id}:
    get:
      description: 根据 ID 返回智能体完整配置
      parameters:
      - description: 智能体 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "404":
          description: 未找到
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: AI 智能体详情
      tags:
      - AI Agent
  /api/alerts/histories:
    get:
      parameters:
      - description: 规则ID
        in: query
        name: rule_id
        type: integer
      - description: 来源
        in: query
        name: source
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 告警历史
      tags:
      - 告警
  /api/alerts/histories/resolve:
    post:
      parameters:
      - description: 规则ID
        in: query
        name: rule_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 手动恢复告警历史
      tags:
      - 告警
  /api/alerts/rules:
    get:
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页
        in: query
        name: size
        type: integer
      - description: 仅启用
        in: query
        name: enabled_only
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 告警规则列表
      tags:
      - 告警
    post:
      consumes:
      - application/json
      parameters:
      - description: 规则
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hivemtk-user_internal_service.AlertRuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 创建告警规则
      tags:
      - 告警
  /api/alerts/rules/{id}:
    delete:
      parameters:
      - description: 规则ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 删除告警规则
      tags:
      - 告警
    get:
      parameters:
      - description: 规则ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 获取告警规则详情
      tags:
      - 告警
    put:
      consumes:
      - application/json
      parameters:
      - description: 规则ID
        in: path
        name: id
        required: true
        type: integer
      - description: 规则
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hivemtk-user_internal_service.AlertRuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 更新告警规则
      tags:
      - 告警
  /api/alerts/rules/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: '{ids:[1,2], enabled:true}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 批量启用/禁用规则
      tags:
      - 告警
  /api/auth/anomaly/alerts:
    get:
      consumes:
      - application/json
      description: 返回当前用户的安全告警，支持按 status 过滤
      parameters:
      - description: 状态过滤：open/resolved/ignored
        in: query
        name: status
        type: string
      - description: 页码（默认1）
        in: query
        name: page
        type: integer
      - description: 每页大小（默认20）
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 查询安全告警列表
      tags:
      - A域-认证安全
  /api/auth/anomaly/alerts/{id}/ignore:
    post:
      consumes:
      - application/json
      description: 将指定告警标记为 ignored，写入审计日志
      parameters:
      - description: 告警 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 忽略说明
        in: body
        name: body
        schema:
          properties:
            note:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 忽略安全告警
      tags:
      - A域-认证安全
  /api/auth/anomaly/alerts/{id}/resolve:
    post:
      consumes:
      - application/json
      description: 将指定告警标记为 resolved，并写入审计日志
      parameters:
      - description: 告警 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 处理说明
        in: body
        name: body
        schema:
          properties:
            note:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 处理（标记已解决）安全告警
      tags:
      - A域-认证安全
  /api/auth/anomaly/login-events:
    get:
      consumes:
      - application/json
      description: 返回当前用户的登录事件（含风险评估结果），按时间倒序
      parameters:
      - description: 页码（默认1）
        in: query
        name: page
        type: integer
      - description: 每页大小（默认20，最大100）
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 查询登录事件列表
      tags:
      - A域-认证安全
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名+密码登录，支持 MFA 第二步验证；登录成功返回 JWT token
      parameters:
      - description: 登录请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hivemtk-user_internal_service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功，返回 token
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "401":
          description: 认证失败
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 用户登录
      tags:
      - Auth
  /api/auth/logout:
    post:
      description: 将当前 Bearer 令牌加入黑名单（立即失效）
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: 登出
      tags:
      - Auth
  /api/auth/me:
    get:
      consumes:
      - application/json
      description: 从 JWT token 解析 user_id 并返回用户基本信息
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: 获取当前登录用户信息
      tags:
      - Auth
  /api/auth/password:
    put:
      consumes:
      - application/json
      description: 修改成功后旧 token 会被加入黑名单
      parameters:
      - description: 修改密码请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hivemtk-user_internal_service.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: 修改当前用户密码
      tags:
      - Auth
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用旧 Bearer token 换发新 token，旧 token 会被加入黑名单
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "401":
          description: 认证失败
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: 刷新 JWT 令牌
      tags:
      - Auth
  /api/bridge/token/reset:
    post:
      description: 旧 token 转入灰度位（PREV），生成并返回新 token 明文（仅此一次）
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: 轮换桥接凭证
      tags:
      - Bridge
  /api/bridge/token/status:
    get:
      description: 返回主/灰度 token 是否已配置（不回显明文）
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: 桥接凭证状态
      tags:
      - Bridge
  /api/clue/engagement:
    post:
      consumes:
      - application/json
      parameters:
      - description: 互动事件
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hivemtk-user_internal_dto.ClueEngagementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
            type: object
      summary: 记录线索互动事件
      tags:
      - 线索评分
  /api/clue/score:
    post:
      consumes:
      - application/json
      parameters:
      - description: 线索 ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hivemtk-user_internal_dto.ClueScoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/hivemtk-user_internal_dto.ClueScoreResponse'
            type: object
      summary: 评分单条线索
      tags:
      - 线索评分
  /api/clue/score-all:
    post:
      consumes:
      - application/json
      parameters:
      - description: 评分上限
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/hivemtk-user_internal_dto.ScoreAllResponse'
            type: object
      summary: 批量评分所有线索
      tags:
      - 线索评分
  /api/clue/score/{clue_id}:
    get:
      parameters:
      - description: 线索 ID
        in: path
        name: clue_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/hivemtk-user_internal_dto.ClueScoreResponse'
            type: object
      summary: 查询线索评分
      tags:
      - 线索评分
  /api/clue/score/list:
    get:
      parameters:
      - description: S/A/B/C/D
        in: query
        name: grade
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页
        in: query
        name: page_size
        type: integer
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/hivemtk-user_internal_dto.ClueScoreListResponse'
            type: object
      summary: 按等级分页查询评分
      tags:
      - 线索评分
  /api/clues:
    get:
      consumes:
      - application/json
      description: 分页查询线索池，支持按来源/状态筛选
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 来源 ID
        in: query
        name: source
        type: integer
      - description: 状态
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: 获取线索列表
      tags:
      - Clue
  /api/clues/{id}:
    delete:
      consumes:
      - application/json
      description: 通过 ID 软删除线索
      parameters:
      - description: 线索 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "400":
          description: 参数错误
          schema:
