      parameters:
      - description: 渠道
        in: path
        name: channel
        required: true
        type: string
      - description: 原始 payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 成功
