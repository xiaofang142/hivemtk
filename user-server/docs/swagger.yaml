          $ref: '#/definitions/hivemtk-user_internal_service.RequestPasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 邮件已发送
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 忘记密码
      tags:
      - Public
  /api/public/reset-password:
    post:
      consumes:
      - application/json
      description: 使用令牌重置密码
      parameters:
      - description: 重置请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hivemtk-user_internal_service.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 密码重置成功
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "400":
          description: 参数错误或令牌无效
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      summary: 重置密码
      tags:
      - Public
  /api/quote:
    post:
      consumes:
      - application/json
      description: 话术取自生效版本、金额取自模板，两者都不是入参；未过闸门/没有生效话术时一行都不写
      parameters:
      - description: 商机号 + 模板代号 + 可选币种/有效期/行覆盖
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hivemtk-user_internal_service.QuoteGenerateInput'
      produces:
      - application/json
      responses:
        "200":
          description: 成功（data 为报价视图，id 是版本行键）
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "400":
          description: 入参不合法（含未知字段：正文与收件人不是入参）
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "404":
          description: 来源商机不存在
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "409":
          description: 闸门未开 / 模板未配或读不出 / 话术无生效版本
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "503":
          description: 底座未装配
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: 由商机生成一版报价草稿
      tags:
      - Quote
  /api/quote/{id}:
    get:
      parameters:
      - description: 版本行主键 quotes.id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "400":
          description: id 形状不合法
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "404":
          description: 报价版本不存在
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "503":
          description: 底座未装配
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: 读取单版报价（含这一版当前开着的审批）
      tags:
      - Quote
  /api/quote/{id}/send:
    post:
      consumes:
      - application/json
      description: 审批未放行时回 202 并带回审批号，本次不外发；放行后重新解析生效话术、认领 draft→sent 再交给出域出口
      parameters:
      - description: 版本行主键 quotes.id
        in: path
        name: id
        required: true
        type: string
      - description: 可选：手里已有那条结论时带上审批号
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_controller.quoteSendBody'
      produces:
      - application/json
      responses:
        "200":
          description: 已发送
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "202":
          description: 已开待办，等待裁决（data.disposition=awaiting）
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "400":
          description: id 或请求体形状不合法
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "401":
          description: 会话里没有操作者身份
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "404":
          description: 报价版本不存在 / 审批号查无此号
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "409":
          description: 闸门未开 / 非草稿 / 审批与对象不符 / 无收件人 / 无行项目 / 话术失效 / 状态写不动
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "502":
          description: 外发失败且状态已退回草稿
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "503":
          description: 底座未装配
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: 发送一版报价（未过审批则只开一条待办）
      tags:
      - Quote
  /api/quote/latest/{quoteID}:
    get:
      parameters:
      - description: 报价逻辑号 quotes.quote_id
        in: path
        name: quoteID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "400":
          description: 编号形状不合法
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "404":
          description: 报价链不存在
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "503":
          description: 底座未装配
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: 读取某张报价单的最新版本
      tags:
      - Quote
  /api/quote/revise/{quoteID}:
    post:
      consumes:
      - application/json
      description: 行项目继承链上最新版，模板不参与；闸门未开、话术无生效版本或基准版没有行项目时一行都不写
      parameters:
      - description: 报价逻辑号 quotes.quote_id
        in: path
        name: quoteID
        required: true
        type: string
      - description: 行覆盖/追加 + 可选币种与有效期；空体 = 原样追加一版
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_controller.quoteReviseBody'
      produces:
      - application/json
      responses:
        "200":
          description: 成功（data 为新版视图，version 已递增）
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "400":
          description: 编号形状不合法 / 体形状不对 / 试图改商机归属或换模板
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "404":
          description: 链上一版都没有（先走生成）/ 基准版没有可继承的行项目
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "409":
          description: 闸门未开 / 版本号已被占用（有人先一步追加）/ 话术失效
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "503":
          description: 底座未装配
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: 在既有报价链上追加一版（还价）
      tags:
      - Quote
  /api/quote/version/{quoteID}/{version}:
    get:
      parameters:
      - description: 报价逻辑号 quotes.quote_id
        in: path
        name: quoteID
        required: true
        type: string
      - description: 版本号（从 1 起，由仓储递增，调用方不能自带）
        in: path
        name: version
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "400":
          description: 编号形状不合法 / 版本号不是正整数
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "404":
          description: 那一版不存在
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
        "503":
          description: 底座未装配
          schema:
            $ref: '#/definitions/hivemtk-user_internal_pkg_utils_response.Response'
      security:
      - BearerAuth: []
      summary: 按版本号读取某一版报价
      tags:
      - Quote
