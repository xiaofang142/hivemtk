# =============================================================================
# golangci-lint 配置（P0-1 修复版，config version 2）
# -----------------------------------------------------------------------------
# 护栏策略：只启用「当前已清零」的层级规则，保证 lint 即刻可执行；
# 随 P2/P3 整改推进，逐步解开下方注释中的规则（见各项 TODO）。
# 架构依据：docs/architecture/GO_FIVE_LAYER_ARCHITECTURE.md（五层单向依赖）
# =============================================================================

version: "2"

run:
  timeout: 5m
  go: "1.25"
  # 架构护栏只约束生产代码；测试文件允许跨层构造夹具（如直连 gorm 建内存 DB）
  tests: false

linters:
  default: none
  enable:
    - govet
    - depguard
    # 2026-09-18 P3-5 第一阶段：unused 存量 65→0（逐项核对后删除死代码；
    # 仅 tests=false 生产面计数），自此钉死为护栏。
    - unused
    # 2026-09-18 P3-5 第一阶段续：ineffassign 存量 26→0（含 3 处真实缺陷：
    # geo GetRelationGraph 忽略 depth / tiktok GetCardStats 忽略 days / tgbot 吞 Send 错误）
    - ineffassign
    # 2026-09-18 P3-5 第二阶段：staticcheck 生产面清零后启用。
    # checks 刻意排除纯风格项：ST1000 包注释（481 处，逐包补写属文档工程）、
    # ST1003 标识符命名（165 处，包名含下划线是全仓既定风格，改名波及面过大）、
    # ST1020/1021/1022 导出注释规范（116 处）、QF* 快速修建议（tagged switch 等）。
    # 保留 SA*（真实缺陷）、S*（简化）、ST1005（错误串规范）并已全部归零。
    - staticcheck
  # TODO(P3-5 护栏常态化·剩余)：errcheck 实测**生产面**存量 354 处（2026-09-18，
  # repo config tests=false 口径；此前注释里的 1713 为 --no-config 含测试全量口径，已更正）。
  # 依本项目「清零后再启用」既定方法论（unused/ineffassign/staticcheck 皆如此），
  # errcheck 不做一次性机械 `_ =` 包裹——那会把「确实该处理却被丢弃」的错误
  # （DB 写、影响后续逻辑的 Unmarshal 等）连同可安全忽略的 Close 一并掩盖，
  # 属质量倒退而非整改。留待专项：逐处判定「补处理 vs 显式 `_ =` + 注释」后再启用。
  # - errcheck
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
        - -QF*
    depguard:
      rules:
        # model 为叶子层：只依赖标准库/第三方 ORM，不得反向依赖任何上层
        model-layer:
          files:
            - "**/internal/model/**.go"
          deny:
            - pkg: "hivemtk-user/internal/service"
              desc: "model 为叶子层，不得反向依赖 service"
            - pkg: "hivemtk-user/internal/controller"
              desc: "model 为叶子层，不得反向依赖 controller"
            - pkg: "hivemtk-user/internal/repository"
              desc: "model 为叶子层，不得依赖 repository"
            - pkg: "hivemtk-user/internal/router"
              desc: "model 为叶子层，不得依赖 router"
            - pkg: "hivemtk-user/internal/aiagent"
              desc: "model 为叶子层，不得反向依赖 aiagent（P0-2 已清零）"

        # dto 为纯数据传输层：不得引用 GORM 实体（P0-7 已清零）
        dto-layer:
          files:
            - "**/internal/dto/**.go"
          deny:
            - pkg: "hivemtk-user/internal/model"
              desc: "dto 不得引用 model 实体，镜像类型 + service 层 mapper 转换"
            - pkg: "gorm.io/gorm"
              desc: "dto 不得依赖 ORM"

        # controller 只依赖 service/dto：不得直连 repository/ORM（P0-5 已清零）
        # TODO(P3-4)：controller→model 清零后，追加 deny hivemtk-user/internal/model
        controller-layer:
          files:
            - "**/internal/controller/**.go"
          deny:
            - pkg: "hivemtk-user/internal/repository"
              desc: "controller 不得直接依赖 repository，应通过 service"
            - pkg: "gorm.io/gorm"
              desc: "controller 不得直连 ORM，应通过 service"

        # repository 不得反向依赖 service/controller
        repository-layer:
          files:
            - "**/internal/repository/**.go"
          deny:
            - pkg: "hivemtk-user/internal/service"
              desc: "repository 不得反向依赖 service"
            - pkg: "hivemtk-user/internal/controller"
              desc: "repository 不得依赖 controller"

        # aiagent 不得反向依赖业务三层（P2-3 已清零，端口接口 + app 装配注入）
        aiagent-layer:
          files:
            - "**/internal/aiagent/**.go"
          deny:
            - pkg: "hivemtk-user/internal/service"
              desc: "aiagent 不得反向依赖 service，走端口接口注入"
            - pkg: "hivemtk-user/internal/repository"
              desc: "aiagent 不得反向依赖 repository，走端口接口注入"
            - pkg: "hivemtk-user/internal/controller"
              desc: "aiagent 不得反向依赖 controller"

# ⚠️ 2026-09-16 更正（FMT-01 回归修复）：gofmt **不能**写在 linters.enable 里。
# golangci-lint v2 已把「格式化器」从 linters 拆出，写在这里会直接报
#   Error: can't load config: gofmt is a formatter
# 并拒绝加载**整个配置** —— 结果是 govet 与 depguard 一道失效，
# 五层架构护栏被静默关闭（这正是同日 FMT-01 提交引入的回归，现已修）。
# 与 CI 里的 `gofmt -l` 步骤互为补充：本段覆盖生产代码（run.tests=false），
# 测试文件由该步骤与 `make fmt-check` 兜住。
formatters:
  enable:
    - gofmt

issues:
  # 存量代码较多，先不限单 issue 数量上限，保证护栏全量可见
  max-issues-per-linter: 0
  max-same-issues: 0
