# B 段（字面量赋值模式）的 CI 执行点 —— E-11 的第 2 层
#
# 为什么单独一个作业，而不是塞进 user-server-ci 的 static-gates：
#   这道门的判据文件只有 scripts/check-secrets.sh 与 scripts/.secret-allowlist，
#   跟 Go/前端编译没有共同触发面；独立作业才能让"改了闸门本身"触发重跑
#   （scripts/check-ci-gate-paths.py 的第 1 条判据就是这个）。
#
# 为什么 CI 只跑 --patterns-only：
#   check-secrets.sh 的 A 段要把本机 .env 里的真凭证值逐个搜进待纳管文件。CI 上没有、
#   也不该有真凭证（把凭证推上 runner 等于第二次泄露）。所以 A 段与真值包含闸
#   （scripts/check-secret-containment.py）一律留在本机，由 .githooks/pre-push 跑；
#   下面第 3 步专门验"CI 上 full 模式必须退 2"，防止它哪天静默空跑冒充绿。
#
# 判据不在本文件里另写一遍：种入／摘除／豁免三格由 scripts/check-secrets-patterns.test.sh
# 常驻持有，本机与 CI 跑的是同一批格子。把反向探针抄进 workflow 的那类做法会漂移
# ——CI 绿着、本机的手册步骤早就改了判据，两边各执一词（本仓 CI 注释里抄读数过期的教训同形）。
#
# 覆盖面边界（别把这里的绿读成"全仓无明文口令"）：
#   本作业只测 B 段的形状判据；真值比对（A 段）只在带 .env 的本机跑、真值包含闸
#   （scripts/check-secret-containment.py）同留本机；gitleaks 的规则集
#   （.github/workflows/gitleaks-config.yml）另作业。scripts/check-secrets-workspace.sh
#   这个脚本本身在仓里（CI 拿得到它、L8 就是拿它做逐字比对），但它扫的
#   <工作区根>/{scripts,docs,cold-start} 三层不在任何 git 仓里 ⇒ CI 上跑了也是空面，
#   所以那一维只由本机跑。
name: Secret Patterns

on:
  push:
    branches: [master, main]
    paths:
      - 'scripts/check-secrets.sh'
      - 'scripts/check-secrets-workspace.sh'
      - 'scripts/.secret-allowlist'
      - 'scripts/check-secrets-patterns.test.sh'
      - 'scripts/pre-push-secrets.sh'
      - '.githooks/pre-push'
      - '.github/workflows/secret-patterns.yml'
  pull_request:
    paths:
      - 'scripts/check-secrets.sh'
      - 'scripts/check-secrets-workspace.sh'
      - 'scripts/.secret-allowlist'
      - 'scripts/check-secrets-patterns.test.sh'
      - 'scripts/pre-push-secrets.sh'
      - '.githooks/pre-push'
      - '.github/workflows/secret-patterns.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patterns-only:
    name: B 段字面量模式 + 常驻反向测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 1) 干净树必须绿（CI 唯一允许跑的这一段）
        run: bash scripts/check-secrets.sh --patterns-only

      - name: 2) 反向测试十格（含"门必须能被假凭证打红"、同族判据同源、红因不吐凭证本体）
        run: bash scripts/check-secrets-patterns.test.sh

      - name: 3) 无 .env 的 runner 上 full 模式必须退 2
        run: |
          set +e
          out=$(bash scripts/check-secrets.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 2 ]; then
            echo "❌ full 模式在 CI 上退 $rc（须 2＝没跑过）。"
            echo "   退 0＝A 段静默空跑冒充绿；退 1＝runner 上不知何时出现了 .env。两种都要查。"
            exit 1
          fi
          echo "✓ A 段在 CI 上明确不可执行 ⇒ 这一维仍只由本机 .githooks/pre-push 守"
