# embed-sdk + packages 静态门（2026-11-14 初心审核补缺）
#
# 为什么单独一个作业：初心审核实测发现内层三个代码区覆盖不均——user-server 门最全
# （layer-boundary/api-contract/enum-consistency/seam-guard…），user-web 有 ci-bridge + eslint 门，
# 而 embed-sdk（客服 Widget，ADR-011）自带测试套件（unit/boundary/ws，node 原生
# test runner 零 npm 依赖）却从未在 CI 跑过。本作业同时运行共享 HTTP 核心自身的测试。
#
# 口径：embed-sdk 测试使用 Node mock（unit+boundary），读取 IIFE 构建产物，需先安装并构建；
# packages/http-core 有独立 node:test；共享包变化还触发 user-server-ci 与 ci-bridge，
# 由管理端、桥扩展、browser_automation 的真实消费测试验证集成。
name: Embed SDK

on:
  push:
    branches: [master, main]
    paths:
      - 'embed-sdk/**'
      - 'packages/**'
      - '.github/workflows/ci-embed-sdk.yml'
  pull_request:
    paths:
      - 'embed-sdk/**'
      - 'packages/**'
      - '.github/workflows/ci-embed-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embed-sdk:
    name: Widget 测试门（unit + boundary）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: embed-sdk/package-lock.json

      - name: 安装 SDK 构建依赖
        run: npm ci
        working-directory: embed-sdk

      - name: 构建 SDK 测试所需 IIFE
        run: npm run build
        working-directory: embed-sdk

      - name: 跑 embed-sdk 测试（unit + boundary）
        run: npm run test:all
        working-directory: embed-sdk

      - name: 共享 HTTP 核心测试
        run: node --test packages/http-core/index.test.js
