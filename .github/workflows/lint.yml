# Lint：golangci-lint（Go）+ ESLint（前端 Bridge 扩展）
# 文档: https://golangci-lint.run/usage/install/
#
# 架构合规检查（五层架构）已合并到 user-server-ci.yml（test job 中），
# 不再在此处重复执行。参见 OPT-CI-07。

name: Lint

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 1 * *'  # 每月 1 日 03:00 UTC：LICENSE 合规自检（v3 P0-S2）
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint (Bridge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-web/bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: user-web/bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  i18n-coverage:
    name: i18n Coverage Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check i18n coverage
        run: node user-web/scripts/check-i18n-coverage.cjs

  license-compliance:
    name: LICENSE Compliance Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: LICENSE 合规自检（AGPL-3.0 第 13 条）
        run: bash scripts/license-compliance-scan.sh --dry-run --no-color
