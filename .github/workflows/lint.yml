# Lint：golangci-lint（Go）+ ESLint（user-web 主应用 + Bridge 扩展）
# 文档: https://golangci-lint.run/usage/install/
#
# 架构合规检查（五层架构）已合并到 user-server-ci.yml（test job 中），
# 不再在此处重复执行。参见 OPT-CI-07。
#
# 缺口修复（OPT-FE-03）：原 lint.yml 的 eslint job 只覆盖 user-web/bridge，
# 主应用 user-web/ 从未被 CI lint 过。这导致 user-web/eslint.config.mjs 中
# 的 `no-restricted-imports`（禁止 default 导入 @/utils/request）形同虚设——
# 规则写了、文档写了、豁免块也维护了，但没有任何 CI 会因违规而失败。
# 现补 `eslint-user-web` job，对主应用全量 lint。

name: Lint

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 1 * *'  # 每月 1 日 03:00 UTC：LICENSE 合规自检（v3 P0-S2）
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint (Bridge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-web/bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: user-web/bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # 主应用 lint：阻断项为「error」。当前全量 628 文件 / 0 error / 18788 warning，
  # 故此处刻意不加 --max-warnings——历史告警债务不阻断，但任何新增 error
  # （含 default 导入、未定义变量等）都会让 job 失败。
  eslint-user-web:
    name: ESLint (user-web 主应用)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: user-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (errors block, warnings informational)
        run: npm run lint:check

  i18n-coverage:
    name: i18n Coverage Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Check i18n coverage
        run: node user-web/scripts/check-i18n-coverage.cjs

  # ── 工作流自身的静态一致性 ──
  # GitHub 不编译 workflow YAML：with.file/context/path 指向不存在的文件、
  # steps.<id> 引用了没写 id: 的步骤、needs 指向不存在的 job、artifact 上传/下载名
  # 不配对、步骤级属性（continue-on-error 等）误写进 with: —— 全部只会在 job 真跑时
  # 才炸，且常以「取到空串」的静默形式出现。本轮就是靠它揪出 release.yml 里
  # steps.buildkit.outputs.digest（无该 id）与已随 94415060 删除的 Dockerfile。
  workflow-refs:
    name: Workflow refs integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check workflow references
        run: python3 scripts/check_workflow_refs.py --repo .

      # scripts/check-ci-step-coverage.py 本身是人工核查用的诊断脚本（月度门/tag 门在 push 上
      # 本就恒跳过，挂成门＝常亮红灯），所以进 CI 的不是它而是**它的用例**：判据一旦退化
      # （例如把节奏门一起判红、或整作业被跳过的死门又看不见），这里当场红，不用等人翻。
      # 用例走假 gh 夹具，不联网、不需要 GITHUB_TOKEN。
      - name: check-ci-step-coverage 用例（假 gh，不联网）
        run: bash scripts/check-ci-step-coverage.test.sh

  # 静态形状检查，不是运行时复现：ubuntu runner 的 bash 是 5.x，本身不会触发
  # 「$VAR 紧跟中文吃字节」；会触发的是 macOS 开发机上的 /bin/bash 3.2 + UTF-8
  # LC_CTYPE（本批实测就栽在那儿：红因里的计数被吃掉，白查一轮）。
  # 所以这道门放在 CI 里做的是「形状不再新增」，代价是它在 runner 上永远不会
  # 因真实字节损坏而红 —— 判据本体是 python，不受 bash 版本影响。
  shell-cjk-expansion:
    name: Shell $VAR+CJK expansion guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check shell scripts for the bash 3.2 CJK expansion hazard
        run: bash scripts/check-shell-cjk-expansion.sh

  license-compliance:
    name: LICENSE Compliance Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: LICENSE 合规自检（AGPL-3.0 第 13 条）
        run: bash scripts/license-compliance-scan.sh --dry-run --no-color
