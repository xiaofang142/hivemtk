# Lint：ESLint（user-web 主应用 + Bridge 扩展）
# 文档: https://golangci-lint.run/usage/install/
#
# Go 侧 lint（golangci-lint，架构护栏 depguard）不在本工作流：它的唯一执行点是
# user-server-ci.yml 的 static-gates 步骤（2026-10-09 B7 复核实测）。此前本文件
# 头注释声称"Lint：golangci-lint（Go）+ ESLint"但通篇无 Go job，属口径谎言，已改。
#
# 架构合规检查（五层架构）已合并到 user-server-ci.yml（test job 中），
# 不再在此处重复执行。参见 OPT-CI-07。
#
# 缺口修复（OPT-FE-03）：原 lint.yml 的 eslint job 只覆盖 user-web/bridge，
# 主应用 user-web/ 从未被 CI lint 过。这导致 user-web/eslint.config.mjs 中
# 的 `no-restricted-imports`（禁止 default 导入 @/utils/request）形同虚设——
# 规则写了、文档写了、豁免块也维护了，但没有任何 CI 会因违规而失败。
# 现补 `eslint-user-web` job，对主应用全量 lint。

name: Lint

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 1 * *'  # 每月 1 日 03:00 UTC：LICENSE 合规自检（v3 P0-S2）
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint (Bridge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-web/bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: user-web/bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # 主应用 lint：阻断项为「error」。此处刻意不加 --max-warnings——历史告警债务不阻断，
  # 但任何新增 error（含 default 导入、未定义变量等）都会让 job 失败。
  # 读数只认 CI：本 job 的 eslint 汇总行在 run 35769669195 印的是
  # `18738 problems (2 errors, 18736 warnings)`。那 2 条 error 在 HEAD 上
  # （browser_automation/src/core/cdp/input.js 的 preserve-caught-error、
  # primitives.js 的 no-useless-assignment），修法在另一条泳道的未提交字节里。
  # 别拿本地数对账：`npm run lint` 带 --fix 会当场改写文件，只读的是 lint:check。
  eslint-user-web:
    name: ESLint (user-web 主应用)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: user-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (errors block, warnings informational)
        run: npm run lint:check

  i18n-coverage:
    name: i18n Coverage Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check i18n coverage
        run: node user-web/scripts/check-i18n-coverage.cjs

  # ── 工作流自身的静态一致性 ──
  # GitHub 不编译 workflow YAML：with.file/context/path 指向不存在的文件、
  # steps.<id> 引用了没写 id: 的步骤、needs 指向不存在的 job、artifact 上传/下载名
  # 不配对、步骤级属性（continue-on-error 等）误写进 with: —— 全部只会在 job 真跑时
  # 才炸，且常以「取到空串」的静默形式出现。本轮就是靠它揪出 release.yml 里
  # steps.buildkit.outputs.digest（无该 id）与已随 94415060 删除的 Dockerfile。
  workflow-refs:
    name: Workflow refs integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check workflow references
        run: python3 scripts/check_workflow_refs.py --repo .

      # scripts/check-ci-step-coverage.py 本身是人工核查用的诊断脚本（月度门/tag 门在 push 上
      # 本就恒跳过，挂成门＝常亮红灯），所以进 CI 的不是它而是**它的用例**：判据一旦退化
      # （例如把节奏门一起判红、或整作业被跳过的死门又看不见），这里当场红，不用等人翻。
      # 用例走假 gh 夹具，不联网、不需要 GITHUB_TOKEN。
      - name: check-ci-step-coverage 用例（假 gh，不联网）
        run: bash scripts/check-ci-step-coverage.test.sh

      # action 的运行时（runs.using）写在**那个 action 自己仓库里**，工作流文件里看不见；
      # 上一轮拿版本号新旧猜"已迁完"，漏了 action-gh-release@v2 和 slsa-verifier installer。
      # 用例的格 10 会把这道门在真仓库上再跑一次，所以出厂的 RUNTIMES 表和豁免账本
      # 只要跟磁盘对不上（漏登记、豁免留空条目、豁免文件里又长出 node20 站点），这里就红。
      - name: check-action-runtime 用例（含真仓库基线自洽）
        run: bash scripts/check-action-runtime.test.sh

      # 门接进 CI 的那道"接线门"：凡是被某个作业实际执行的 `scripts/check-*`，
      # 它自己的脚本路径与从源码里派生出的判据文件（*.baseline / *.registry）都必须
      # 出现在该工作流的 on.push.paths / on.pull_request.paths 里 —— 缺一行就等于
      # "改判据不重跑这道门"（platform docs-link-check.yml 的旧坑，本仓 §23.16 第 5 条）。
      # 本作业自身没有 paths 过滤（每次 push 都跑），所以它守的是别的作业的触发面。
      - name: 门的触发面覆盖（paths 必须含门脚本与其基线）
        run: python3 scripts/check-ci-gate-paths.py --repo .

      - name: check-ci-gate-paths 用例（假仓库夹具，不联网）
        run: bash scripts/check-ci-gate-paths.test.sh

      # 变异电池收尾用的删除闸（scripts/mut_dispose.py）的用例。挂这里的理由跟其余
      # `.test.sh` 一样：常驻电池的判据退化不会自己出声，只有它的用例被每次 push 跑到才行。
      # 立项背景是 2026-09-24 的实测事故：`mut_collection_p703.py --clone . --check`
      # 在收尾时把整棵 r45-lane（含 .git 与当轮 18 项未提交字节）rmtree 掉了——
      # `dispose()`/`workdir()` 两道闸加这九组断言是把那一类缺陷钉住的唯一常驻件。
      # 判据里有静态面（每枚带 --clone 面的电池的 --clone／入口闸／收尾闸三处计数必须相等），
      # 所以 `scripts/mut_*.py` 任一改动没同时接满两道闸，这里红。
      # 步名只写**分组数**、不写处数：处数由用例自己现报（`===== 用例：N 处断言全过 =====`），
      # 写死的枚数会随格子漂移——本轮就抓到四份这种谎（§23.25 第 18、19 段）。
      - name: mut_dispose 用例（删除闸九组，处数现报，不联网）
        run: bash scripts/mut-dispose-guard.test.sh

      # `scripts/mut_db_poolcfg.py`（db.go 池参数那条接线的四刀电池）的用例。
      # 这一族只跑不依赖 go 与测试库的腿：预检内核的五格内存反向格 + 对真源码的锚点预检
      # + 删除闸入参（`--clone .` 必须装架前退）。挂这里的理由是 §23.22 第 6 段③ 那条：
      # 一次性 `/tmp` 驱动的读数只能引用不能复跑，常驻化之后判据本身还得有人守。
      - name: mut_db_poolcfg 用例（四刀预检七组，处数现报，不联网、不跑 go）
        run: bash scripts/mut-db-poolcfg.test.sh

      # `scripts/mut_webhook_ai_trigger.py`（入站消息 AI 触发归属那条守卫的五刀电池）的用例。
      # 同上一族，只跑不依赖 go 与测试库的腿：预检内核的内存反向格（含 classify 的
      # "必须仍绿"反查）+ 对真源码的锚点预检 + 独立 grep 复算（两枚锚点）+ 删除闸入参。
      # 全族杀伤（要编 Go、要测试库）留在本地跑，登记见审计文档 §23.25。
      - name: mut_webhook_ai_trigger 用例（五刀预检八组，处数现报，不联网、不跑 go）
        run: bash scripts/mut-webhook-ai-trigger.test.sh

      # 常驻电池的"字节身份行"门（scripts/check-battery-identity.py）。立项读数是 2026-09-28
      # 修前现测的：`logs/` 下 15 个族 562 份产物、66 个轮次目录里，按短语 `基线字节` 只有
      # P701 的 12 份与 R30 的 1 份带着"这轮读的是哪一笔字节"——其余族的读数在树里无从复算（§23.25）。
      # 两轴都要：轴一（源码形状）能在今晚放刀前就拦住"身份行打印在 tee 之前"这一形，
      # 轴二（直接读树里最近一轮产物）才拦得住"改了写路径却没跑"、"行号先后量不到的调用图"
      # 与"树里长出一族没有驱动"（A5 归属对账：门的判据对象只从驱动正文反推，磁盘上的族可能更多）。
      # A6 管的是更贵的一类：身份行**有**、那句口径却是假的。两半——A6a 驱动把来树字节 copy2 进克隆
      # 却声明"未入库字节不进本轮读数"（A4 只认这句在不在，认不出真不真）；A6b 同一机制却一处现测
      # 份数都没有（不传 `overlay=`，也没有手写"已在 HEAD n/N"／"覆盖 N 个"）：它不撒谎，只是让读数
      # 无从复算，比 A6a 更安静。
      # 两份台账（合并带进来的他人泳道件，都带上界与"补齐就必须删条目"的过期判据）：
      # D0–D4 记"有树内落点、没有身份发射点"的电池（族照样实测，实测只用于判条目过期）；
      # O1–O5 记"连落点都不在树"的电池——它们进不了 drivers()，O1 专门拦"盘上有、名单外"的静默排除，
      # 末行必须把进门数与登记数一起印（＝候选现数），不许只报进门的那批冒充全量。
      # A7 名字轴（对象集＝候选全量）：调用本文件里没定义的名字。这一族 `py_compile` 是**绿**的
      # （语法没错），要跑到那行才 NameError；本机 pyflakes 能抓但没注册进任何门＝全靠手动。
      # 立项证据是 2026-09-28 的二次合并：对方加进 `mut_db_poolcfg.py` 的那行 `{tip(clone)}`
      # 只活在它的树里（本树该文件 `grep -c 'def tip'` ＝ 0）⇒ 照抄＝四刀电池一开跑就炸。
      # 先自测后现数：门的判据退化不会自己出声，只跑现数等于把门的失效留到人身上。
      # 步名里不写格数——枚数由脚本自己印（§23.23 摘掉的那处"枚数写死在注释里"不复发）。
      - name: check-battery-identity 反向自测（形状／产物／豁免／归属／口径／名字／两份台账七类格，纯内存＋临时目录）
        run: python3 scripts/check-battery-identity.py --selftest

      - name: check-battery-identity 对真仓库现数（成员与族目录都现取）
        run: python3 scripts/check-battery-identity.py --quiet-ok

  # 静态形状检查，不是运行时复现：ubuntu runner 的 bash 是 5.x，本身不会触发
  # 「$VAR 紧跟中文吃字节」；会触发的是 macOS 开发机上的 /bin/bash 3.2 + UTF-8
  # LC_CTYPE（本批实测就栽在那儿：红因里的计数被吃掉，白查一轮）。
  # 所以这道门放在 CI 里做的是「形状不再新增」，代价是它在 runner 上永远不会
  # 因真实字节损坏而红 —— 判据本体是 python，不受 bash 版本影响。
  shell-cjk-expansion:
    name: Shell $VAR+CJK expansion guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check shell scripts for the bash 3.2 CJK expansion hazard
        run: bash scripts/check-shell-cjk-expansion.sh

      # 扫描面口径改过一次（os.walk + 黑名单 → git 口径，为了把 gitignore 的 logs/ 取证
      # 快照树请出门外），所以"它还有牙"必须每次重跑那 9 格，而不是信一句"我改对了"。
      - name: check-shell-cjk-expansion 反向测试（证明它会红）
        run: bash scripts/check-shell-cjk-expansion.test.sh

  # shell 静态分析：全仓 *.sh / *.bash 的 shellcheck「error 级」零容忍（零债 ⇒ 不带基线，
  # 定档依据与盲区写在脚本头）。建门之前 `grep -n shellcheck .github/workflows/*.yml` 是
  # 零命中，也就是这 130 多个 shell 文件（含装机/部署/口令轮换这类会动到生产与凭证的）
  # 从来没有被任何静态分析跑过一遍。
  #
  # 为什么挂这个 workflow 而不是新建一个：lint.yml 的 on.push 没有 paths 过滤，任何一笔
  # 推送都会跑它 —— 新门不必先对一遍"改哪些文件才重跑"的触发面（那道洞的形状见
  # gitleaks-config.yml 的立项说明）。扫描面本身是 git 口径（tracked + 未跟踪未忽略），
  # CI 的干净检出里没有仓根 logs/ 那棵取证快照树，本地与 CI 因此量同一个面。
  #
  # 工具按版本钉死（pip 包 shellcheck-py==0.11.0.1 ⇒ shellcheck 0.11.0，与建门时本机
  # 实测同一版），且装完立刻印版本：升版若把某个文件判成 error，这里是"红 + 版本号"，
  # 不是静默漂移。venv 失败时退回 --user 安装（老 pip 不认 --break-system-packages，
  # 两种参数各试一次），最终仍拿不到可执行就整步红——缺工具不许退 0。
  shellcheck-static:
    name: Shellcheck (error 级零容忍)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 装 shellcheck（钉版本，与本地实测同一版）
        run: |
          set -eu
          if python3 -m venv /tmp/scvenv && /tmp/scvenv/bin/pip -q install shellcheck-py==0.11.0.1; then
            SC=/tmp/scvenv/bin/shellcheck
            echo "/tmp/scvenv/bin" >> "$GITHUB_PATH"
          else
            python3 -m pip install --user shellcheck-py==0.11.0.1 \
              || python3 -m pip install --user --break-system-packages shellcheck-py==0.11.0.1
            SC="$HOME/.local/bin/shellcheck"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          test -x "$SC"
          "$SC" --version

      - name: check-shellcheck（全仓 shell 文件的 error 面）
        run: bash scripts/check-shellcheck.sh

      # 反向测试也进 CI：这道闸的判据有五条分支（缺工具、枚举不确定、面骤减、非法 UTF-8
      # 文件、shellcheck 的 rc×finding 数错配）。只看在真树上退 0，不自证它红得起来。
      - name: check-shellcheck 反向测试（证明它会红）
        run: bash scripts/check-shellcheck.test.sh

  # `check-bash32-parse.sh` 的执行点。立项背景见脚本头：2026-09-24 那句「命令替换里嵌 case」
  # 在 shellcheck（0 条 finding）与 CI 的 bash 5.x 里都看不见，只有 mac 出厂的 /bin/bash 3.2
  # 会在 `-n` 那一步报语法错——而部署／装机／口令轮换这类脚本恰恰是人在 mac 上直接跑的。
  #
  # 为什么这一枚必须挂在 macos 上：判据按 major 版本选档，解析器 ≥4 时门**只打 SKIP 并退 0**
  # （故意不给绿读数，见脚本判据①）。所以 ubuntu 上跑它等于跑一根没有牙的棍子，§23.22 第 5 段
  # 记的就是这个"注册了但从未开火"的形状。GitHub 的 macos-latest 镜像的 /bin/bash 就是
  # 3.2.57(1)-release，与本机同一版 ⇒ 挂这里它才真的有判据。
  #
  # 假绿防线：第一格先实测 `$BASH_VERSION`。哪天镜像不再出厂 3.2，这一格红——宁可作业红，
  # 也不让"门在 CI 里恒 SKIP"重新伪装成一个绿步骤。代价：macOS runner 按 10 倍计分钟数，
  # 但这三格只读 143 个文件的解析层，不装工具、不联网、不编 Go。
  bash32-parse:
    name: Bash 3.2 parser gate (macOS 出厂解析器)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 解析器必须是 3.x（非 3.x 时本作业没有判据，宁可红不许静默 SKIP）
        run: |
          set -eu
          v=$(/bin/bash -c 'echo $BASH_VERSION')
          case "$v" in
            3.*) echo "实测 /bin/bash = $v ⇒ 有牙档，门的判据在本作业成立" ;;
            *) echo "::error::runner 的 /bin/bash 是 $v（不是 3.x）⇒ check-bash32-parse.sh 在这里只会打 SKIP，本作业没有判据"
               exit 1 ;;
          esac

      - name: check-bash32-parse（全仓 shell 文件按 3.2 读通）
        run: bash scripts/check-bash32-parse.sh

      # 九组反向断言也进 CI：这道门的"绿"和"根本没判"长得几乎一样——在解析器 ≥4 的那一档
      # （ubuntu runner 的形状）它必走 SKIP 分支。只有 C1–C3 那三格证明它读得出坏文件，
      # "退 0"才是判据而不是空跑。本作业跑在 macos-latest（出厂 3.2.57），所以这三格在这里是真判据；
      # 上一格的版本实测保证：一旦镜像换成 ≥4，本作业整体红，不会以 rc=2 的形态混成绿。
      - name: check-bash32-parse 反向测试（九组，处数由用例现报，证明它会红）
        run: bash scripts/check-bash32-parse.test.sh

  license-compliance:
    name: LICENSE Compliance Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: LICENSE 合规自检（AGPL-3.0 第 13 条）
        run: bash scripts/license-compliance-scan.sh --dry-run --no-color
