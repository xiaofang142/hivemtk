# SBOM（Software Bill of Materials）生成
# 使用 syft 生成 SPDX 格式的物料清单
# 文档: https://github.com/anchore/syft

name: SBOM

on:
  push:
  # PR 上也要跑：改动依赖清单 / 本工作流 / 断言脚本时，SBOM 的生成与断言必须在合并前
  # 就被证明还能用。只在 push 上跑的话，「合并后才发现产物断言不过」是必然结局。
  # paths 刻意收窄到依赖清单与本门自己的判据：SBOM 的输入面就是这些文件。
  pull_request:
    paths:
      - 'scripts/check-sbom-artifacts.py'
      - '.github/workflows/sbom.yml'
      - 'user-server/go.mod'
      - 'user-server/go.sum'
      - 'user-web/package.json'
      - 'user-web/package-lock.json'
      - 'user-web/bridge/package.json'
      - 'user-web/bridge/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (SPDX, Go)
        # OPT-CI-02：移除重复的 syft scan（原 L29/L30 都跑同一命令）
        working-directory: user-server
        run: |
          syft scan dir:. -o spdx-json=../sbom-go.spdx.json

      - name: Generate SBOM (SPDX, Bridge)
        # OPT-CI-02：移除重复的 syft scan
        working-directory: user-web/bridge
        run: |
          syft scan dir:. -o spdx-json=../../sbom-bridge.spdx.json

      - name: Generate SBOM (SPDX, Frontend)
        working-directory: user-web
        run: |
          syft scan dir:. -o spdx-json=../sbom-frontend.spdx.json

      - name: SBOM 产物断言（A2-b：文件存在 ≠ 覆盖了本仓的依赖）
        # 2026-10-24：前面的三步只要退出码是 0 就算过——而「成功地产出一个没用的东西」
        # 有太多种形态：格式换成 table、working-directory 写错导致三份产物内容雷同、
        # syft 一条依赖都没解析出来（SPDX 结构合法、packages 为空）。
        # 本步骤断言两件事：① 三份产物都能被解析成 SPDX 且 packages 非空；
        # ② 每份产物覆盖了对应清单里的**全部直接依赖**（go.mod 不带 // indirect 的行、
        #   package.json 的 dependencies）——这一条才回答「这份 SBOM 是不是本仓的」。
        # 工作流段（谁生成/谁上传）由 static-gates 里的 --workflow 那一步守着。
        run: python3 scripts/check-sbom-artifacts.py --dir .

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: |
            sbom-go.spdx.json
            sbom-bridge.spdx.json
            sbom-frontend.spdx.json
          retention-days: 90

  # 原先这里还有一步 `Attach SBOM to release`（`if: startsWith(github.ref,'refs/tags/')`
  # + softprops/action-gh-release）。它删于第四十七轮，两条理由：
  #   1) 本工作流的权限只有 `contents: read`（:11），而创建/更新 Release 要 write ⇒
  #      那一步在 tag 上必然 403；又配了 `fail_on_unmatched_files: true`，等于第一次
  #      发版就把这道"每次 push 都跑"的工作流整个打红。它从未暴露过，是因为本仓
  #      **一个 tag 都没有推过**（`git ls-remote --tags` 空），tag-only 步骤零执行史。
  #   2) Release 由 release.yml 的 create-release 作业创建（那里才是 job 级
  #      `permissions: contents: write` 的位置，也是本仓既有的最小授权形状）；
  #      在同一条 tag 上再挂一个会创建 Release 的作业＝两个作业抢同一个 tag。
  # 因此三份 SPDX 的生成留在本工作流（push 就跑、产物存 90 天），挂载改到 release.yml
  # 的 SBOM 作业里补齐——那边此前只生成/附带 go 与 bridge 两份，前端那份从未进过发行。
