# GitHub Actions CI for user-server
# 平台：ubuntu-latest（提供 PostgreSQL 服务用于集成测试）
# 触发：push / pull_request 作用于 master / main 分支
name: user-server-ci

on:
  push:
    branches: [master, main]
    paths:
      - 'user-server/**'
      - 'user-web/**'
      - 'user-web/bridge/**'
      - 'embed-sdk/**'
      - 'scripts/api-inventory.sh'
      - 'scripts/check-architecture.sh'
      - 'scripts/check-date-bucket-tz.sh'
      - 'scripts/check-unwired-assets.sh'
      - 'scripts/date-bucket-tz.baseline'
      # 下面两行是 `test-nil-deref` 作业的命门：门自己的判据与它读的基线若不进触发面，
      # "只改判据"/"只动基线"这类提交就根本不重跑这道门（platform docs-link-check.yml 的教训）。
      - 'scripts/check-test-nil-deref.py'
      - 'scripts/test-nil-deref.baseline'
      - '.github/workflows/user-server-ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'user-server/**'
      - 'user-web/**'
      - 'user-web/bridge/**'
      - 'embed-sdk/**'
      - 'scripts/api-inventory.sh'
      - 'scripts/check-architecture.sh'
      - 'scripts/check-date-bucket-tz.sh'
      - 'scripts/check-unwired-assets.sh'
      - 'scripts/date-bucket-tz.baseline'
      - 'scripts/check-test-nil-deref.py'
      - 'scripts/test-nil-deref.baseline'
      - '.github/workflows/user-server-ci.yml'

# ============================================================================
# 拆分说明（2026-09-20 第二十六轮 · A3）：原来 15 个步骤串在一个 `test` job 里，
# 任何一步红 ⇒ 同 job 后续步骤全部 skipped。这不是假想，是实测：
#   scripts/check-ci-step-coverage.py 对最近 40 次 run 统计出 NEVER_RUN 7 个 ——
#   golangci-lint 死 pin 的那五周里，Coverage / Coverage threshold / govulncheck /
#   gitleaks / 基准 全是「写好了但一次都没跑过」的门。
# 第二种黑障更隐蔽：job 级 timeout-minutes 会把 `go test ./... -race` **从中间掐断**，
# 字母序在掐断点之后的包这一轮永远不被执行，而步骤结论只有 failure/cancelled，
# 看不出少了谁。同一个门在三次 run 里的三种结论（都是本轮 gh run 日志实测）：
#   · c72243d5：109 个包报了 583s，停在 internal/security，19:27:45 被 20 分钟超时 cancel；
#   · 8b253b5a：勉强跑完 123 个包（测试时间合计 832s），但 internal/service 撞
#     `-timeout 300s` 抛 `panic: test timed out after 5m0s`；
#   · 286e88cb：又被 20 分钟超时 cancel。
# ⇒ CI 对「测试到底跑没跑完」没有稳定答案。所以这里按「谁能遮挡谁」重新切 job，
# 每个 job 的 timeout 由它自己那一步的实测耗时定，并且每跑测试的 job 末尾都加
# 「包完整性断言」：go list 的包集合必须逐个出现在输出里，缺哪个就点名哪个 ——
# 让「静默少跑」重新变成一件会自己喊出来的事。
#
# 一次切分带来的重复：`services.postgres` 只能逐 job 写（GitHub 没有 include/partial，
# services 也不接受 env context 引用）。步骤级 env 已提到 workflow 级，只有一份。
# 改 PG 口令/端口时，services 块有 4 处要同步（test-race-core / test-race-service /
# coverage / benchmark），workflow env 1 处 —— 别只改一处，那会造出「某个 job 连不上库
# 于是整包 skip」的第三种黑障。
# ============================================================================
env:
  # 测试期占位密钥（≥32 字符满足 PLATFORM_JWT_SECRET 安全检查）
  PLATFORM_JWT_SECRET: ci-jwt-secret-placeholder-32-chars-min-len-OK
  # 私域基线 §7.2：测试期允许 hash embedding 降级
  EMBEDDING_ALLOW_FALLBACK: "true"
  # 测试期禁用 WeCom 真实出站
  WECOM_DISABLE_OUTBOUND: "1"
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: password123
  POSTGRES_DB: marketing_tools
  # ⚠️ 2026-09-16 审计修复：internal/pkg/testutil 读取的是 POSTGRES_TEST_* 前缀，
  # 而上面这几个 POSTGRES_* 是给服务本体用的。此前 CI 只注入 POSTGRES_*，
  # testutil 便回落到默认端口 8202（PG 实际监听 5432）→ DialTimeout 失败 →
  # 依赖 testutil 的 288 个测试文件全部 t.Skipf → go test 退出 0，
  # 阻断式门禁形同虚设。此处补齐 TEST_ 前缀变量，让门禁真正执行。
  #
  # 刻意**不设** POSTGRES_TEST_DBNAME：testutil 会以它为前缀创建
  # `<前缀>_<pid>` 的进程级隔离库。若设成 marketing_tools，CI 里就会出现一堆
  # 形如 `marketing_tools_12345` 的库，看起来像业务库而非测试库。
  # 留空即用默认前缀 user_db_test，语义自明。
  POSTGRES_TEST_HOST: 127.0.0.1
  POSTGRES_TEST_PORT: "5432"
  POSTGRES_TEST_USER: admin
  POSTGRES_TEST_PASSWORD: password123

jobs:
  # ------------------------------------------------------------------
  # 静态门：不碰 DB、不跑测试，红只可能是代码本身的问题。
  # 放在独立 job 的意义：它红的时候，测试/覆盖率/安全扫描照常出各自结论。
  # ------------------------------------------------------------------
  static-gates:
    name: Static gates (arch/vet/gofmt/lint/build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: user-server/go.sum

      - name: go mod download
        working-directory: user-server
        run: go mod download

      - name: 架构合规检查(分层)
        # 对应 docs/architecture/GO_FIVE_LAYER_ARCHITECTURE.md
        # 阻断模式：违规直接 fail，强制修复而非 warn-only 放行
        run: |
          chmod +x scripts/check-architecture.sh
          bash scripts/check-architecture.sh

      - name: 日期口径守卫（宿主机时区棘轮）
        # 2026-09-20 第二十六轮（A8/A9）：本仓 DB 会话时区钉在 Asia/Shanghai，而
        # Go 进程跟宿主机时区 ⇒ 日期键/日期窗口在 UTC 容器上恒漂 8 小时，这类缺陷
        # 在开发机（CST）永远复现不出来。守卫是棘轮：命中数只许降不许升，
        # 基线见 scripts/date-bucket-tz.baseline。
        run: |
          chmod +x scripts/check-date-bucket-tz.sh
          bash scripts/check-date-bucket-tz.sh

      - name: 未接线资产台账核对（能力可用性的事实源）
        # 2026-09-20 第二十六轮（A10）：这道门把 docs/architecture/AI_CORE_FEATURE_INVENTORY.md
        # 的接线登记逐条 grep 回代码（34 行 / 现值 29 已接线），此前只在各卡验收时由人手动跑。
        # 覆盖面在干净克隆（HEAD 9c40b9f4）上做过两次变异实测，不是照抄脚本的说法：
        #   会响 —— 登记的符号整体消失（defpat 与 callpat 双双零命中 ⇒ rc=2，须回灌文档）；
        #           未接线项被悄悄接上而文档没改（状态漂移 ⇒ rc=1）。
        #   不会响 —— 注释掉 router.go 里 app.InitHumanTaskRuntime(gormDB) 这一行调用后仍 exit 0
        #           （13a 的 callpat 被装配函数自身的命中满足，脚本自己的注释已声明这一边界）；
        #           只改函数名也到不了 rc=2（defpat 未锚定，改名后仍是前缀命中）。
        # 所以它守的是"文档登记与代码是否还一致"，不守"运行时确实装配了"—— 后者仍由装配测试负责，
        # 这里不写成编译器/测试给不了的保证。接进 CI 的理由是手动跑过的门没人复验，
        # 而恒绿的门与坏掉的门长得一样。耗时实测：干净克隆 17.7s（全 grep，无 DB / 无网络）。
        run: |
          chmod +x scripts/check-unwired-assets.sh
          bash scripts/check-unwired-assets.sh

      - name: go vet
        working-directory: user-server
        run: go vet ./...

      - name: gofmt（格式门禁）
        # 2026-09-16 审计（FMT-01）：新增。
        # 为什么需要独立一步：user-server/.golangci.yml 只启用 govet+depguard
        # （run.tests=false），gofmt 既不在 lint 覆盖内，测试文件更是完全不被 lint。
        # 无门禁 → 格式漂移无人可查，累积 34 个未格式化文件。
        #
        # 2026-09-20（A7）：原来这里自己抄了一遍 gofmt 判据，于是和本地 make fmt-check
        # 各写各的 —— 而本地那份漏了 stderr：文件根本解析不了时 gofmt 不进 stdout、
        # 只往 stderr 报错且 rc=2，格式门会对着语法坏掉的文件打 ✅。
        # 现在直接调 Makefile 里那份修好的实现：**同一份判据，不再有两处口径**。
        run: make fmt-check

      - name: golangci-lint（架构护栏 depguard）
        # P0-1：分层依赖方向护栏，规则见 user-server/.golangci.yml
        # 2026-09-19 审计（第二十五轮）：version v2.1.6 → v2.10.0。
        # v2.1.6 官方二进制以 go1.24 构建，而本仓 go.mod 与 .golangci.yml 的 run.go 都是 1.25，
        # 该步在 runner 上从 2026-08-11 起就是 exit 3 抛
        #   can't load config: the Go language version (go1.24) used to build golangci-lint
        #   is lower than the targeted Go version (1.25)
        # 即：errcheck / depguard / staticcheck 五道护栏在 master 上从未执行过，
        # 且它排在 go build 之前，单测、基准、覆盖率、覆盖率阈值四步被连带 skipped。
        # 不选最新 v2.13.2：同一份 HEAD 影子克隆里 v2.10.0 为 0 issues，v2.13.2 另报 6 条
        # 新命中（5 govet + 1 staticcheck），换版本与修存量不应混在一个提交里。
        # 再升 Go 目标版本时，这里的 pin 要一并核对 —— Makefile 的 GOLANGCI_LINT_VERSION
        # 与本行由 `make lint-version-check` 强制对齐（不一致就拒绝跑本地 lint）。
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.10.0
          working-directory: user-server
          args: --timeout=10m

      - name: go build
        working-directory: user-server
        run: go build ./...

  # ------------------------------------------------------------------
  # 测试解引用门（批M-10 建门、本作业接进 CI）：用例不许在"被调函数能交回
  # (nil, nil)"的返回值上未判空即解引用。判据、口径边界与零条目基线的来路见
  # `scripts/check-test-nil-deref.py` 文件头与 §23.16 第 8 条／§23.17。
  #
  # 为什么是独立 job 而不是 static-gates 的第 9 个步骤：本文件 A3 注释记的就是
  # "同 job 前序一步红 ⇒ 后续步骤全成 skipped"，那道被藏起来的门与坏掉的门长得一样。
  #
  # 触发面：文件头 paths 里的 `scripts/check-test-nil-deref.py` 与
  # `scripts/test-nil-deref.baseline` 两行是本作业的命门 —— 缺了它们，"只改判据"
  # 或"只放宽基线"这类提交根本不会重跑这道门（platform `docs-link-check.yml` 的教训）。
  # 门的输入是整棵 Go 测试树，故 `user-server/**` 必须在（它已在）。
  #
  # 耗时与不遮挡性：本机实测 1.2s（纯 grep/正则，无 DB、无网络、不编译）。
  # 同一版字节在两个树上读数一致（泳道树 & `git archive HEAD` 的只含已提交内容树：
  # `函数键 116 · 确证站点 0 · 存疑 114` ⇒ rc=0），所以它绿不依赖本泳道未推的改动。
  # ------------------------------------------------------------------
  test-nil-deref:
    name: Test nil-deref gate (零条目基线棘轮)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # 用 @v7 而不是本文件其余作业沿用的 @v4：`check-action-runtime.py` 把本文件的
        # checkout@v4 站点数锁在上界 12（R47 抬干净侧后留下的账，理由"并行泳道持有该文件
        # 未提交改动"）。新作业若跟着抄 v4 ⇒ 上界 13 > 12 当场红，而这道门的账只许降不许升。
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 确证站点不得超过基线（新增即红；修掉不划掉也红）
        run: python3 scripts/check-test-nil-deref.py

  # ------------------------------------------------------------------
  # 安全扫描：与静态门/测试互不遮挡。gitleaks 阻断，govulncheck 观测。
  # ------------------------------------------------------------------
  security-scans:
    name: Security scans (gitleaks / govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks-action 要读提交历史。此前该步骤被上游的死 pin 挡着从未真跑过，
          # 「depth=1 时它到底扫不扫得到东西」没有任何历史证据，而扫不到时它是 exit 0
          # —— 正是最坏的一种假绿。按 gitleaks-action 文档要求显式拉全历史。
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        # OPT-CI-05：密钥扫描（2026-08-16 审计任务）
        # 2026-09-18 转阻断：对全部 git 跟踪文件做高置信度密钥模式
        # （AKIA/ghp_/sk-/PRIVATE KEY/xoxb/AIza）扫描，命中 0 处；
        # "首次启用不阻断"前提已不成立。若未来误报测试夹具，
        # 用仓库根 .gitleaks.toml allowlist 精确豁免，而不是回退本门禁。
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: user-server/go.sum

      - name: Go dependency audit (govulncheck)
        # OPT-CI-04：依赖漏洞审计（2026-08-16 审计任务）
        # 2026-09-18 评估后维持不阻断（与 gitleaks/npm audit 不同）：
        #   ① go1.25.13 工具链下 `govulncheck@latest`(v1.8.0) 无法安装——其要求 go>=1.26.0，
        #      CI parity 扫描直接 exit 1，门禁尚未运行即失败，与代码无关；
        #   ② 本地 go1.26.0 扫描测得 26 个「可达」stdlib 漏洞（crypto/x509 等），
        #      仅在 go1.26.1 修复，非本仓库可编辑消除，转阻断会立即红。
        # 前置条件：CI 工具链升级到 go1.26.1+（且 govulncheck 可安装）后再转阻断。
        # 在此之前本步骤保留 continue-on-error，作为漏洞趋势观测而非门禁。
        working-directory: user-server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: true

  # ------------------------------------------------------------------
  # -race：拆成 core + service 两片。
  # internal/service 单独成 job 的原因（本轮 CI 日志实测）：它是唯一撞过
  # `-timeout 300s` panic 的包（8b253b5a run：`FAIL hivemtk-user/internal/service
  # 300.056s` + `panic: test timed out after 5m0s`），本地不带 -race 就要 452~567s，
  # 和其余 152 个包（-race 合计 532s）共用一个 per-package timeout 只会两边都将就：
  # 要么包被 timeout 掐死，要么 job 白等。拆开各按自己的耗时定预算。
  # ------------------------------------------------------------------
  test-race-core:
    name: Unit tests -race (user-server core)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: marketing_tools
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d marketing_tools"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: user-server/go.sum

      - name: Run unit tests (with -race)
        working-directory: user-server
        # 分片判据用 grep -x（整行精确匹配），不是 grep -v internal/service：
        # 后者会把 internal/service/churn 等 9 个子包一起赶出 core 片，
        # 而它们个个很快，留在 core 里更均衡。
        run: |
          set -euo pipefail
          go list ./... | grep -vx 'hivemtk-user/internal/service' | sort > pkgs.txt
          echo "本分片包数：$(wc -l < pkgs.txt | tr -d ' ') / 全仓 $(go list ./... | wc -l | tr -d ' ')"
          rc=0
          # -p 1 是硬要求：用例共享同一批测试库槽位（见 testutil procTestDBSlots），
          # 并发跑会互相认领对方的行（reply_guard 认领表 / delayed-<id> 撞自增主键）。
          # -timeout 900s：core 片最慢的包是 browser_automation/service 98s（本轮实测），
          # 900s ≈ 9 倍余量；不再沿用 300s，那个值连 internal/service 都不够。
          go test $(cat pkgs.txt) -count=1 -timeout 900s -p 1 -short -race 2>&1 | tee go-test.log || rc=$?
          # 包完整性断言：go test 对每个包都会落一行 ok/FAIL/? [no test files]。
          # 少了行 = 有包没跑（超时截断/panic/构建中断），必须点名，不能只给个红叉。
          awk '/^(ok|FAIL|\?)[[:space:]]/{print $2}' go-test.log | sort -u > reported.txt
          missing=$(comm -23 pkgs.txt reported.txt || true)
          if [ -n "$missing" ]; then
            echo "::error::以下包没有产生任何结果（套件被掐断，这些包本轮等于没测）："
            echo "$missing"
            exit 1
          fi
          exit $rc

  test-race-service:
    name: Unit tests -race (user-server service)
    runs-on: ubuntu-latest
    # 单包 job 也要给足：per-package -timeout 与 job timeout 谁先到都会截断，
    # 45 min = 本地非 race 最慢观测（567s）的 ~4.7 倍，够 -race 与 runner 挤占。
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: marketing_tools
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d marketing_tools"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: user-server/go.sum

      - name: Run unit tests (with -race)
        working-directory: user-server
        run: |
          set -euo pipefail
          go list ./... | grep -x 'hivemtk-user/internal/service' | sort > pkgs.txt
          n=$(wc -l < pkgs.txt | tr -d ' ')
          if [ "$n" != "1" ]; then
            echo "::error::分片判据失效：internal/service 整行匹配到 $n 个包（应为 1），两片之和不再覆盖全仓"
            exit 1
          fi
          rc=0
          go test $(cat pkgs.txt) -count=1 -timeout 2400s -p 1 -short -race 2>&1 | tee go-test.log || rc=$?
          awk '/^(ok|FAIL|\?)[[:space:]]/{print $2}' go-test.log | sort -u > reported.txt
          missing=$(comm -23 pkgs.txt reported.txt || true)
          if [ -n "$missing" ]; then
            echo "::error::internal/service 没有产生结果（被超时截断），本轮等于没测"
            exit 1
          fi
          exit $rc

  # ------------------------------------------------------------------
  # 覆盖率 + 阈值 + Codecov：三者必须在同一 job（profile 是 job 本地文件）。
  # 不与 -race 合趟：合趟后任一片红就把整份 profile 拖残，阈值门会跟着假红，
  # 两个互不相干的结论被绑成一个 —— 拆 job 的目的正是解掉这种耦合。
  # ------------------------------------------------------------------
  coverage:
    name: Coverage (user-server)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: marketing_tools
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d marketing_tools"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: user-server/go.sum

      - name: Coverage (Go)
        # 2026-08-15 P0-CI：覆盖率采集（包含 -cover.out 上传 Codecov）
        # 2026-09-20（A3）：-timeout 300s → 2400s —— 300s 连 internal/service 单包都不够，
        # 被掐断的包不写进 profile，覆盖率会莫名其妙掉、然后由阈值门报成"测试退步"。
        working-directory: user-server
        run: |
          set -euo pipefail
          mkdir -p coverage
          go list ./... | sort > pkgs.txt
          # 完整性断言的期望集合只能是「有测试文件的包」：开了 -coverprofile 之后，
          # 无测试包不再打 `?   pkg [no test files]`，而是
          # `\t pkg \t\tcoverage: 0.0% of statements`（行首是制表符），
          # 下面那条 awk 三个行首锚点都匹配不上 ⇒ 11 个 cmd/* 会被点名成
          # "未产生结果"（run 35467723878 实测），把真信号淹在假红里。
          go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... | sort > testable.txt
          rc=0
          go test $(cat pkgs.txt) -count=1 -timeout 2400s -p 1 -short \
            -coverprofile=coverage/go-cover.out -covermode=atomic 2>&1 | tee go-test.log || rc=$?
          awk '/^(ok|FAIL|\?)[[:space:]]/{print $2}' go-test.log | sort -u > reported.txt
          missing=$(comm -23 testable.txt reported.txt || true)
          if [ -n "$missing" ]; then
            echo "::error::以下包未产生结果，profile 不完整（覆盖率数字不可信）："
            echo "$missing"
            exit 1
          fi
          go tool cover -func=coverage/go-cover.out | tail -1
          exit $rc

      - name: Coverage threshold (OPT-CI-06)
        # OPT-CI-06：覆盖率门禁
        #
        # 2026-09-15 修复「假性完成 + 打折完成」：
        #   原实现 THRESHOLD=50 但只打 ::warning:: 从不失败 —— 既非阻断，
        #   且 50% 阈值高于真实覆盖率，一旦改成阻断会立刻让 CI 变红。
        #
        # 实测基线（2026-09-15，go test -p 1 ./internal/... -covermode=atomic）：
        #   total statements coverage = 22.0%
        #
        # 因此本门禁分两层：
        #   1) FLOOR（阻断）：低于回归底线即失败，防止覆盖率倒退
        #   2) TARGET（仅提示）：产品目标 60%，当前 22.0%，差距如实打印、不掩盖
        #
        # 提升路径：随测试补齐逐步上调 FLOOR（22 → 30 → 40 → 50 → 60）。
        # 注意：不得为了让 CI 变绿而下调 FLOOR。
        # if: always() —— 上一步有用例红时 profile 依然是完整的
        # （包完整性断言已保证不缺包，go test 对失败包照样写覆盖数据），
        # 阈值结论不该被测试红一起吞掉；但缺 profile 时必须显式报错，
        # 不能让 `go tool cover` 的 "no such file" 被读成"覆盖率为 0"。
        if: always()
        working-directory: user-server
        run: |
          set -euo pipefail
          if [ ! -s coverage/go-cover.out ]; then
            echo "::error::coverage/go-cover.out 缺失或为空 —— 这是「没测到」，不是「覆盖率为 0」，别按覆盖率退步归因"
            exit 1
          fi
          TOTAL=$(go tool cover -func=coverage/go-cover.out | tail -1 | awk '{print $3}' | sed 's/%//')
          FLOOR=20     # 阻断底线（回归保护）
          TARGET=60    # 产品目标（OPT-CI-06 原始要求）

          echo "Total coverage : ${TOTAL}%"
          echo "Blocking floor : ${FLOOR}%"
          echo "Product target : ${TARGET}%  (未达成，差距 $((TARGET - ${TOTAL%.*})) 个百分点)"

          if awk "BEGIN {exit !($TOTAL < $FLOOR)}"; then
            echo "::error::覆盖率 ${TOTAL}% 低于回归底线 ${FLOOR}%，构建失败"
            echo "::error::请补齐测试后再提交；不得下调 FLOOR 以求通过。"
            exit 1
          fi
          if awk "BEGIN {exit !($TOTAL < $TARGET)}"; then
            echo "::warning::覆盖率 ${TOTAL}% 未达产品目标 ${TARGET}%（当前为阻断底线 ${FLOOR}%）"
          fi

      - name: Upload coverage to Codecov
        # 2026-08-15 P0-CI：Codecov 集成（需在仓库 settings 配置 CODECOV_TOKEN）
        #
        # 注意分工（OPT-CI-06 修复后）：
        #   覆盖率「门禁」由上方 "Coverage threshold (OPT-CI-06)" 步骤承担（阻断式）。
        #   本步骤只负责「上传报告供趋势查看」，故 fail_ci_if_error 保持 false ——
        #   缺 CODECOV_TOKEN 时不应让构建失败。codecov 侧策略见仓库根 codecov.yml。
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v4
        with:
          files: user-server/coverage/go-cover.out
          flags: go
          name: user-server-coverage
          fail_ci_if_error: false  # 缺 token 时不阻断；本地可跑

  # ------------------------------------------------------------------
  # 基准：P0-5 性能基线（要读真实表，需要 postgres）。
  # ------------------------------------------------------------------
  benchmark:
    name: Benchmarks (P0-5 性能基线)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: marketing_tools
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d marketing_tools"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: user-server/go.sum

      - name: Run go benchmarks (P0-5 性能基线)
        # 仅跑 P0-5 性能基线（500 条 IN 翻转 < 200ms 阈值），bench 默认只跑 1 次耗时短
        working-directory: user-server
        run: go test -run=^$ -bench=BenchmarkAckOutboundDeliveredBatchReturningWithStatus_500_P0_5 -benchtime=1x -timeout 900s ./internal/repository/

  # ------------------------------------------------------------------
  # user-web 三个关注点各自成 job：原先 ESLint 一红就把 npm audit 和
  # `npm run build` 一起 skip 掉（本轮实测：一条 no-useless-assignment 令
  # 「前端能否构建」这道门连续多次没有结论）。
  # ------------------------------------------------------------------
  user-web-eslint:
    name: ESLint (user-web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: user-web/package-lock.json

      - name: npm ci
        working-directory: user-web
        run: npm ci

      - name: ESLint (OPT-FE-01)
        # OPT-FE-01：user-web 主项目 ESLint 接入 CI
        # 2026-09-15 修复「打折完成」：原为 continue-on-error: true（首次启用不阻断），
        # 门禁形同虚设。实测 `eslint .` 全仓 631 文件 0 errors（18788 warnings 不阻断），
        # 故改为阻断式门禁。
        working-directory: user-web
        run: npm run lint:check --if-present

  user-web-security:
    name: npm audit (user-web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: user-web/package-lock.json

      - name: npm ci
        working-directory: user-web
        run: npm ci

      - name: npm audit (OPT-CI-10)
        # OPT-CI-10：NPM 依赖漏洞扫描，仅阻断 high/critical（moderate/low 只报不挡）。
        # 2026-09-19 审计（第二十五轮）重写。原写法在 runner 上恒定红且**零覆盖**：
        # npm 10 打的是 /-/npm/v1/security/audits/quick，runner 日志里 npm 自己已经提示
        # 「This endpoint is being retired. Use the bulk advisory endpoint instead」，返回
        #   400 Invalid package tree, run `npm install` to rebuild your package-lock.json
        # 而 --json 那次把这份错误对象当成审计报告解析，打出
        #   high: 0 critical: 0 total: 0
        # —— 看着像「扫过了、没漏洞」，实际一个依赖都没查。本地用 npm 10.8.2 / 10.9.0 /
        # 11.x + 官方 registry + CI 同形 node_modules 都复现不出该 400，故按 runner 侧
        # 事实处理：改走 bulk advisories 端点（npm ≥ 11），并加覆盖数下限校验。
        # 三点固定：① npx 装到临时目录，不动 job 内的全局 npm（原本是为后面的
        # `npm run build` 留的；build 已拆到独立 job，但这条隔离仍值得保留）；
        # ② 显式官方 registry —— npmmirror 的 /-/npm/v1/security/*
        # 是 404 NOT_IMPLEMENTED，换镜像等于换回零覆盖；③ dependencies.total=0 直接
        # exit 2，绝不与「无漏洞」同形。
        working-directory: user-web
        run: |
          export npm_config_registry=https://registry.npmjs.org
          npx --yes npm@11 audit --audit-level=high --json > npm-audit.json 2>/dev/null || true
          node -e '
            const fs = require("fs");
            let r;
            try { r = JSON.parse(fs.readFileSync("npm-audit.json", "utf8")); }
            catch (e) {
              console.error("::error::npm audit 拿不到 JSON 报告（端点或网络故障），本步骤零覆盖：" + e.message);
              process.exit(2);
            }
            const md = r.metadata || {}, v = md.vulnerabilities || {}, deps = (md.dependencies || {}).total;
            if (!deps) {
              console.error("::error::npm audit 未返回依赖树（dependencies.total=0），本步骤零覆盖："
                + JSON.stringify(r).slice(0, 300));
              process.exit(2);
            }
            console.log(`已审计依赖 ${deps} 个：critical ${v.critical || 0} / high ${v.high || 0}`
              + ` / moderate ${v.moderate || 0} / low ${v.low || 0}`);
          '
          # 再跑一次可读报告：high/critical 命中时由此步骤码阻断
          npx --yes npm@11 audit --audit-level=high
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload npm audit report
        # 将 JSON 报告上传为 artifact，便于 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-web-npm-audit
          path: user-web/npm-audit.json
          if-no-files-found: ignore
          retention-days: 30

  user-web-build:
    name: Build (user-web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: user-web/package-lock.json

      - name: npm ci
        working-directory: user-web
        run: npm ci

      - name: Build
        working-directory: user-web
        run: npm run build

  bridge-extension-test:
    # HiveBridge 扩展 vitest（协议/限速/sanitize/fallback 51 用例）
    name: Bridge Extension Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: user-web/bridge/package-lock.json

      - name: npm ci
        working-directory: user-web/bridge
        run: npm ci

      - name: vitest
        working-directory: user-web/bridge
        run: npx vitest run --reporter=default

      - name: ESLint (P0-CI)
        # 2026-08-15 P0-CI：开启前端 ESLint
        # eslint.config.mjs 在 user-web/bridge/，npm ci 已安装依赖
        # 2026-09-18 转阻断：原"首次启用不阻断"约定到期。实测本地
        # `npm run lint` = 0 errors / 69 warnings（warn 不阻断），满足门禁条件。
        # warnings 清零属独立议题，勿在此阻断。
        working-directory: user-web/bridge
        run: npm run lint --if-present

      - name: vitest coverage
        # 2026-08-15 P0-CI：前端覆盖率采集
        working-directory: user-web/bridge
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text
        continue-on-error: true  # 缺 c8/v8 配置时不阻断

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v4
        with:
          files: user-web/bridge/coverage/lcov.info
          flags: bridge
          name: bridge-coverage
          fail_ci_if_error: false

  embed-sdk-lint:
    name: Lint (embed-sdk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: embed-sdk/package-lock.json

      - name: npm ci
        working-directory: embed-sdk
        run: npm ci

      # 测试读取的是 IIFE 构建产物 dist/marketing-chat-widget.iife.js（见
      # test/unit.test.mjs 与 boundary.test.mjs 的 IIFE_PATH），必须先 build。
      # 原 job 只有 npm ci + npm test，因此每次都以
      # 「IIFE 产物不存在,请先执行 npm run build」exit 1 失败。
      - name: Build
        working-directory: embed-sdk
        run: npm run build

      # 用 test:all 而非 test：boundary.test.mjs 同样读取 IIFE 产物，且覆盖
      # open/close/toggle 循环、重复 init、超大消息体、危险协议 origin 等边界，
      # 原 job 只跑 unit 会漏掉这一整组断言。两者均为纯 Node mock，无网络依赖。
      - name: Test (unit + boundary)
        working-directory: embed-sdk
        run: npm run test:all

  api-inventory:
    # 2026-09-16 更正（RISK-06）：原名 "API Inventory Compare"，但它从不比对 ——
    # 只产出清单快照、不设门禁。真正的阻断式契约门禁在 api-contract.yml
    # （audit_api_contract.py --strict）。此处按实际行为改名，避免误导。
    name: API Inventory Report (non-blocking)
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate API inventory
        run: bash scripts/api-inventory.sh
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: api-inventory
          path: api-inventory.md
