# GitHub Actions CI for user-server
# 平台：ubuntu-latest（提供 PostgreSQL 服务用于集成测试）
# 触发：push / pull_request 作用于 master / main 分支
name: user-server-ci

on:
  push:
    branches: [master, main]
    paths:
      - 'user-server/**'
      - 'user-web/**'
      - 'user-web/bridge/**'
      - 'embed-sdk/**'
      - 'scripts/api-inventory.sh'
      - 'scripts/check-architecture.sh'
      # 架构门的 L4 宽口径基线：门读它，不进触发面 ⇒ "只动基线"的提交不重跑这道门。
      - 'scripts/arch-l4-getdb.baseline'
      - 'scripts/check-date-bucket-tz.sh'
      - 'scripts/check-unwired-assets.sh'
      # 已清零的假性未完成资产门：判据脚本本体进触发面，改它必须重跑（check-ci-gate-paths 的规矩）。
      - 'scripts/check-cleared-fake-assets.sh'
      # 参数中心读取点门：每条参数要么有人读、要么文案承认未接线（同上，脚本本体即判据）。
      - 'scripts/check-config-param-readpoints.py'
      # 上面那道门的用例（12 枚夹具控制）：门的判据分叉在前端那一臂，而前端臂的失效形态是
      # 「少一个读取点没人报」——只有用例能把它变成红。用例不进触发面 ⇒ 改夹具/改判据的提交
      # 不重跑那一步（#63 同一口井）。
      - 'scripts/check-config-param-readpoints.test.sh'
      # 配置治理五道门（G2~G6）的脚本本体与判据基线，进触发面的原因同上：
      # 只改判据/只动基线的提交不重跑这道门，就得到一道「看起来在跑、永远绿」的门。
      - 'scripts/check-config-param-defaults.py'
      # 上面那道门的覆盖率棘轮：门读它，不进触发面 ⇒ "只放宽基线"的提交不重跑这道门。
      - 'scripts/config-param-defaults.baseline'
      - 'scripts/check-hardcode-tunable.py'
      - 'scripts/hardcode-tunable.baseline'
      - 'scripts/check-config-param-keystyle.py'
      - 'scripts/check-i18n-coverage.py'
      - 'scripts/i18n-coverage-baseline.json'
      # 文本编码门（G7）的脚本本体与它的替身字符豁免基线：注释里的中文被工具折成
      # U+FFFD 这种损坏不会编译报错、不会测试报错，只有门能出声；基线不进触发面
      # ⇒「只放宽豁免」的提交不重跑这道门（同 #63 那口井）。
      - 'scripts/check-text-encoding.py'
      - 'scripts/text-encoding.baseline'
      # 上面那道门的用例（21 枚假树控制）也有自己的 CI 执行点，判据文件同样得进触发面：
      # 否则"只改夹具/只放宽某格期望"的提交不重跑那一步（同一口井）。
      - 'scripts/check-text-encoding.test.sh'
      - 'scripts/date-bucket-tz.baseline'
      # 下面两行是 `test-nil-deref` 作业的命门：门自己的判据与它读的基线若不进触发面，
      # "只改判据"/"只动基线"这类提交就根本不重跑这道门（platform docs-link-check.yml 的教训）。
      - 'scripts/check-test-nil-deref.py'
      - 'scripts/test-nil-deref.baseline'
      # 这两行是上面那道「PG 名额与池上界同源」门的命门：判据脚本与它的用例。
      # 少了任何一行，改判据/改夹具的提交就不重跑这道门（同一口井：#63 那次教训）。
      - 'scripts/check-ci-pg-capacity.py'
      - 'scripts/check-ci-pg-capacity.test.sh'
      # A2-a 依赖策略门（弃维护库的引用面收敛 + 声明形状 + 禁入名单）：脚本本体与它的
      # 手写合约基线都进触发面——"只改判据"/"只放宽 seam/review"的提交必须重跑这道门。
      - 'scripts/check-dependency-policy.py'
      - 'scripts/dependency-policy.baseline'
      # A4-a 核心域分档覆盖率门：脚本本体与棘轮基线。基线本身就是判据的一部分
      # （下调底线＝放宽标准），不进触发面就得到一道永远绿的棘轮。
      - 'scripts/check-core-coverage.py'
      - 'scripts/core-coverage.baseline'
      # A2-b SBOM 产物断言（工作流段的静态判据在 static-gates 里跑）：
      # 脚本本体进触发面，否则"只改判据"的提交不重跑它。
      - 'scripts/check-sbom-artifacts.py'
      # 路由消费面取证器的口径自检（static-gates 作业那一步）：它的 10 枚控制是这个工具
      # 唯一能自证判据没坏的东西，而它产出的四档名册会被别的文档引用。
      # 脚本本体不进触发面 ⇒ "只改正则/只放宽排除表"的提交不重跑这一步（同 #63 那口井）。
      - 'scripts/route-consumer-triage.py'
      # 菜单×路由×守卫三方对账器（上面那一步的自检 + 能力面表的事实源）与它的残余基线：
      # 判据本体不进触发面 ⇒ "只改一条区间口径/只往基线里加一条理由"的提交不重跑这一步；
      # 基线不进触发面 ⇒ "只放宽基线"（把一条真残余写成已评审）的提交同样不重跑。
      - 'scripts/menu-route-role-audit.py'
      - 'scripts/menu-block-residual.baseline'
      # Makefile 不进触发面 ⇒ "只改这两道门的配方"的提交根本不重跑它们。
      # 由 scripts/check-ci-gate-paths.py 第 4 条判据常驻守着（含 pull_request 那份镜像）。
      - 'Makefile'
      - '.github/workflows/user-server-ci.yml'
      # 后台任务租户归属门：判据脚本本体与登记表都进触发面 ——
      # 只改判据、或只动登记表的提交必须重跑这道门（同 check-ci-gate-paths 的规矩）；
      # 自检脚本也进来，"门自己坏掉"必须能被改到它的那次提交抓到。
      - 'scripts/check-tenant-ctx-writes.py'
      - 'scripts/tenant-ctx-cron.registry'
      - 'scripts/check-tenant-ctx-writes.test.sh'
      # 事件发布租户门（A9）：判据脚本本体进触发面 ——
      # 只改判据的提交必须重跑这道门，否则它退化成恒绿也没人发现。
      - 'scripts/check-event-publish-tenant.py'
  pull_request:
    branches: [master, main]
    paths:
      - 'user-server/**'
      - 'user-web/**'
      - 'user-web/bridge/**'
      - 'embed-sdk/**'
      - 'scripts/api-inventory.sh'
      - 'scripts/check-architecture.sh'
      # 架构门的 L4 宽口径基线：门读它，不进触发面 ⇒ "只动基线"的提交不重跑这道门。
      - 'scripts/arch-l4-getdb.baseline'
      - 'scripts/check-date-bucket-tz.sh'
      - 'scripts/check-unwired-assets.sh'
      - 'scripts/check-cleared-fake-assets.sh'
      - 'scripts/check-config-param-readpoints.py'
      # 与 push 段同因：读取点门的用例只在被改动的那次运行里才有机会出声。
      - 'scripts/check-config-param-readpoints.test.sh'
      # 配置治理五道门（G2~G6）的脚本本体与判据基线，进触发面的原因同上：
      # 只改判据/只动基线的提交不重跑这道门，就得到一道「看起来在跑、永远绿」的门。
      - 'scripts/check-config-param-defaults.py'
      # 上面那道门的覆盖率棘轮：门读它，不进触发面 ⇒ "只放宽基线"的提交不重跑这道门。
      - 'scripts/config-param-defaults.baseline'
      - 'scripts/check-hardcode-tunable.py'
      - 'scripts/hardcode-tunable.baseline'
      - 'scripts/check-config-param-keystyle.py'
      - 'scripts/check-i18n-coverage.py'
      - 'scripts/i18n-coverage-baseline.json'
      # 与 push 段同因：文本编码门的脚本本体与替身字符豁免基线，两个事件都要能被
      # "改到它的那次提交"拉起；它的用例（21 枚假树控制）也在这道作业里跑，一并进。
      - 'scripts/check-text-encoding.py'
      - 'scripts/text-encoding.baseline'
      - 'scripts/check-text-encoding.test.sh'
      - 'scripts/date-bucket-tz.baseline'
      - 'scripts/check-test-nil-deref.py'
      - 'scripts/test-nil-deref.baseline'
      - 'scripts/check-ci-pg-capacity.py'
      - 'scripts/check-ci-pg-capacity.test.sh'
      # A2-a 依赖策略门（弃维护库的引用面收敛 + 声明形状 + 禁入名单）：脚本本体与它的
      # 手写合约基线都进触发面——"只改判据"/"只放宽 seam/review"的提交必须重跑这道门。
      - 'scripts/check-dependency-policy.py'
      - 'scripts/dependency-policy.baseline'
      # A4-a 核心域分档覆盖率门：脚本本体与棘轮基线。基线本身就是判据的一部分
      # （下调底线＝放宽标准），不进触发面就得到一道永远绿的棘轮。
      - 'scripts/check-core-coverage.py'
      - 'scripts/core-coverage.baseline'
      # A2-b SBOM 产物断言（工作流段的静态判据在 static-gates 里跑）：
      # 脚本本体进触发面，否则"只改判据"的提交不重跑它。
      - 'scripts/check-sbom-artifacts.py'
      # 与 push 段同因：取证器的自检门在两个事件上都得能被改到脚本的那次运行拉起。
      - 'scripts/route-consumer-triage.py'
      # 与 push 段同因：对账器的判据本体与它的残余基线，两个事件都要能被改到它的那次提交拉起。
      - 'scripts/menu-route-role-audit.py'
      - 'scripts/menu-block-residual.baseline'
      # 与上面 push 段同因：`make fmt-check`／`make lint-config-verify` 的判据在 Makefile 里。
      - 'Makefile'
      - '.github/workflows/user-server-ci.yml'
      # 与 push 段同因：后台任务租户归属门的判据本体、登记表与自检脚本。
      - 'scripts/check-tenant-ctx-writes.py'
      - 'scripts/tenant-ctx-cron.registry'
      - 'scripts/check-tenant-ctx-writes.test.sh'
      # 事件发布租户门（A9）：判据脚本本体进触发面 ——
      # 只改判据的提交必须重跑这道门，否则它退化成恒绿也没人发现。
      - 'scripts/check-event-publish-tenant.py'

# ============================================================================
# 拆分说明（2026-09-20 第二十六轮 · A3）：原来 15 个步骤串在一个 `test` job 里，
# 任何一步红 ⇒ 同 job 后续步骤全部 skipped。这不是假想，是实测：
#   scripts/check-ci-step-coverage.py 对最近 40 次 run 统计出 NEVER_RUN 7 个 ——
#   golangci-lint 死 pin 的那五周里，Coverage / Coverage threshold / govulncheck /
#   gitleaks / 基准 全是「写好了但一次都没跑过」的门。
# 第二种黑障更隐蔽：job 级 timeout-minutes 会把 `go test ./... -race` **从中间掐断**，
# 字母序在掐断点之后的包这一轮永远不被执行，而步骤结论只有 failure/cancelled，
# 看不出少了谁。同一个门在三次 run 里的三种结论（都是本轮 gh run 日志实测）：
#   · c72243d5：109 个包报了 583s，停在 internal/security，19:27:45 被 20 分钟超时 cancel；
#   · 8b253b5a：勉强跑完 123 个包（测试时间合计 832s），但 internal/service 撞
#     `-timeout 300s` 抛 `panic: test timed out after 5m0s`；
#   · 286e88cb：又被 20 分钟超时 cancel。
# ⇒ CI 对「测试到底跑没跑完」没有稳定答案。所以这里按「谁能遮挡谁」重新切 job，
# 每个 job 的 timeout 由它自己那一步的实测耗时定，并且每跑测试的 job 末尾都加
# 「包完整性断言」：go list 的包集合必须逐个出现在输出里，缺哪个就点名哪个 ——
# 让「静默少跑」重新变成一件会自己喊出来的事。
#
# 一次切分带来的重复：`services.postgres` 只能逐 job 写（GitHub 没有 include/partial，
# services 也不接受 env context 引用）。步骤级 env 已提到 workflow 级，只有一份。
# 改 PG 口令/端口时，services 块有 4 处要同步（test-race-core / test-race-service /
# coverage / benchmark），workflow env 1 处 —— 别只改一处，那会造出「某个 job 连不上库
# 于是整包 skip」的第三种黑障。
# ============================================================================
env:
  # 测试期占位密钥（≥32 字符满足 PLATFORM_JWT_SECRET 安全检查）
  PLATFORM_JWT_SECRET: ci-jwt-secret-placeholder-32-chars-min-len-OK
  # 私域基线 §7.2：测试期允许 hash embedding 降级
  EMBEDDING_ALLOW_FALLBACK: "true"
  # 测试期禁用 WeCom 真实出站
  WECOM_DISABLE_OUTBOUND: "1"
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: password123
  POSTGRES_DB: marketing_tools
  # ⚠️ 2026-09-16 审计修复：internal/pkg/testutil 读取的是 POSTGRES_TEST_* 前缀，
  # 而上面这几个 POSTGRES_* 是给服务本体用的。此前 CI 只注入 POSTGRES_*，
  # testutil 便回落到默认端口 8202（PG 实际监听 5432）→ DialTimeout 失败 →
  # 依赖 testutil 的 288 个测试文件全部 t.Skipf → go test 退出 0，
  # 阻断式门禁形同虚设。此处补齐 TEST_ 前缀变量，让门禁真正执行。
  #
  # 刻意**不设** POSTGRES_TEST_DBNAME：testutil 会以它为前缀创建
  # `<前缀>_<pid>` 的进程级隔离库。若设成 marketing_tools，CI 里就会出现一堆
  # 形如 `marketing_tools_12345` 的库，看起来像业务库而非测试库。
  # 留空即用默认前缀 user_db_test，语义自明。
  POSTGRES_TEST_HOST: 127.0.0.1
  POSTGRES_TEST_PORT: "5432"
  # testutil 的实例钉扎只认「显式声明的快测端口」（8217 或本变量）。
  # CI 的 service 容器映射到标准 5432，必须在这里一并声明，否则配置门会以
  # "pinned to the dedicated fast instance" 拒绝，288 个依赖测试库的文件全部失败。
  USER_POSTGRES_TEST_HOST_PORT: "5432"
  POSTGRES_TEST_USER: admin
  POSTGRES_TEST_PASSWORD: password123

jobs:
  # ------------------------------------------------------------------
  # 静态门：不碰 DB、不跑测试，红只可能是代码本身的问题。
  # 放在独立 job 的意义：它红的时候，测试/覆盖率/安全扫描照常出各自结论。
  # ------------------------------------------------------------------
  static-gates:
    name: Static gates (arch/vet/gofmt/lint/build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: user-server/go.sum

      - name: go mod download
        working-directory: user-server
        run: go mod download

      - name: 架构合规检查(分层)
        # 对应 docs/architecture/GO_FIVE_LAYER_ARCHITECTURE.md
        # 阻断模式：违规直接 fail，强制修复而非 warn-only 放行
        run: |
          chmod +x scripts/check-architecture.sh
          bash scripts/check-architecture.sh

      - name: 日期口径守卫（宿主机时区棘轮）
        # 2026-09-20 第二十六轮（A8/A9）：本仓 DB 会话时区钉在 Asia/Shanghai，而
        # Go 进程跟宿主机时区 ⇒ 日期键/日期窗口在 UTC 容器上恒漂 8 小时，这类缺陷
        # 在开发机（CST）永远复现不出来。守卫是棘轮：命中数只许降不许升，
        # 基线见 scripts/date-bucket-tz.baseline。
        run: |
          chmod +x scripts/check-date-bucket-tz.sh
          bash scripts/check-date-bucket-tz.sh

      - name: 未接线资产台账核对（能力可用性的事实源）
        # 2026-09-20 第二十六轮（A10）：这道门把 docs/architecture/AI_CORE_FEATURE_INVENTORY.md
        # 的接线登记逐条 grep 回代码（登记 37 行 / 实测 32 行已接线，见 rc=0 那行自报），
        # 此前只在各卡验收时由人手动跑。行数会随台账增删漂移，别把它当常量核对。
        # 覆盖面在干净克隆（HEAD 9c40b9f4）上做过两次变异实测，不是照抄脚本的说法：
        #   会响 —— 登记的符号整体消失（defpat 与 callpat 双双零命中 ⇒ rc=2，须回灌文档）；
        #           未接线项被悄悄接上而文档没改（状态漂移 ⇒ rc=1）；
        #           改名一律会响（第二十六轮 r31 在 HEAD 0e39be33 的 --shared 克隆里
        #           三种改法各实测一次）：新名仍以旧名为前缀（NewHumanTaskService→…V2）时
        #           callpat 的 `X\(` 形状约束被切断 ⇒ rc=1「回退（登记为已接线却无调用点）」，
        #           切断前缀（→MakeHumanTaskSvc）则 defpat 也断 ⇒ rc=2「定义缺失」。
        #   不会响 —— 注释掉 router.go 里 app.InitHumanTaskRuntime(gormDB) 这一行调用后仍 exit 0
        #           （13a 的 callpat 被装配函数自身的命中满足，脚本自己的注释已声明这一边界）。
        # 所以它守的是"文档登记与代码是否还一致"，不守"运行时确实装配了"—— 后者仍由装配测试负责，
        # 这里不写成编译器/测试给不了的保证。接进 CI 的理由是手动跑过的门没人复验，
        # 而恒绿的门与坏掉的门长得一样。耗时实测：干净克隆 17.7s（全 grep，无 DB / 无网络）。
        run: |
          chmod +x scripts/check-unwired-assets.sh
          bash scripts/check-unwired-assets.sh

      - name: 已清零的假性未完成资产不得长回来
        # 2026-10-09（B7）：本门此前只在本地 `make audit` 里跑——"本地绿、CI 不知道"的门
        # 与坏掉的门长得一样（同 check-unwired-assets 当年接 CI 的理由）。19 条判据来自
        # docs/architecture/PSEUDO_INCOMPLETE_INVENTORY_2026-10.md A 类：已删的说谎符号
        # 不得原样长回、已修的真接线不得断。无 DB 无网络，纯 grep。
        run: bash scripts/check-cleared-fake-assets.sh --repo .

      - name: 后台任务租户归属门（新增后台任务必须显式声明扇出/租户无关）
        # 2026-10-22：桥接链路线上故障后建门。SaaS 模式下后台路径写租户表却没带租户 ctx
        # 会被 tenancyidx 隔离守卫 fail-closed 拒绝，而任务"照跑、什么都不干"（只报数不报错）。
        # 判据不猜实现（扇出可能在 service 方法内部），改为**完整性 + 防腐烂**：
        # 每个 cron 注册点必须在 scripts/tenant-ctx-cron.registry 里登记扇出锚点或租户无关理由；
        # 锚点消失、任务不再调锚点、登记项失配，逐条红。无 DB 无网络，纯静态。
        run: python3 scripts/check-tenant-ctx-writes.py

      - name: 后台任务租户归属门用例（假树夹具，9 枚控制）
        # 恒绿的门与坏掉的门长得一样：这一格逐条注入 NEW/STALE/BROKEN/SEAM/缺表五种违规，
        # 要求门逐条开火。缺了它，判据正则退化成恒绿时 CI 完全无感。
        run: bash scripts/check-tenant-ctx-writes.test.sh

      - name: 事件发布租户门（租户域事件只能经 event.PublishCtx 盖章）
        # 2026-10-23（SaaS 审计 A9）：T021「发布点自己填 TenantID」是 40+ 处各写一遍的形状，
        # 漏一处 ⇒ 订阅者拿到 0 ⇒ on 模式 fail-closed 空转或落默认租户。
        # 判据同 check-gorm-only：把执行者收成唯一一个 —— internal/ 里禁止裸 event.Publish( 与
        # .Publish(event.Event{，必须走 PublishCtx/PublishEventCtx（从 ctx 盖章）。纯静态。
        run: python3 scripts/check-event-publish-tenant.py

      - name: 参数中心读取点门（要么有人读、要么承认未接线）
        # 2026-10-09（B7）：同上从 make audit 常驻化到 CI。判据现读 user-server 种子与
        # 非测试 Go 源，接线后不撤"未接线"标注、或新参数既没人读也不自我声明，都当场红。
        run: python3 scripts/check-config-param-readpoints.py

      - name: 参数中心读取点门用例（假树夹具，不联网、不要数据库）
        # 这道门有 12 枚夹具控制（处数由用例自己现报，写死的枚数会随格子漂移）：
        # UNDECLARED／STALE／单行条目枚举／条目头漂走退 2／缺种子文件退 2／常量形态读取点／
        # 只有 _test.go 引用不算读取点，以及前端那一臂的三枚——
        # 「rt* 调用算生产读取点」「组不在下发面 ⇒ FRONTEND_READ_NOT_DISPATCHED」
        # 「键被 runtimePublicKeys 排除 ⇒ 同一条判据的第二条腿也要开火」。
        # 为什么这一格必须常驻：本轮把「白名单=前端在读」换成「user-web 里真有 rt* 调用」时，
        # 门本体绿了，而它的用例在缺 `user-web/src` 的假树上悄悄坏了 6 枚（新加的扫描面
        # 前置把每格的 rc 都改写成 1）——没有执行点的自检就是会这样烂掉，
        # 而它烂掉之后与「全绿」在 CI 输出上完全一样。
        run: bash scripts/check-config-param-readpoints.test.sh

      - name: 参数中心默认值与代码兜底常量一致（阻断）
        # 2026-10-11（阶段五 G3）：读侧（GetDuration）与校验侧（validateValue）共用
        # parseDurationSeconds，所以种子 DefaultValue 与代码兜底常量必须同源，否则读出来
        # 的值会被 min/max 静默改写成别的数。
        run: python3 scripts/check-config-param-defaults.py

      - name: 新增可调旋钮必须入库（阻断；已是 Get*() 兜底实参的算已接线）
        # 2026-10-11（阶段五 G4）：只卡新增。存量 286 个常量名在
        # scripts/hardcode-tunable.baseline 里，刷基线必须是人的显式动作。
        run: python3 scripts/check-hardcode-tunable.py

      - name: 参数 key/group 命名规范与唯一（阻断）
        # 2026-10-11（阶段五 G5）：key 一旦上线就是公开契约（前端 runtime 端点把 key
        # 原样当 JSON 字段下发），改名等于让已配站点静默回落默认值。
        run: python3 scripts/check-config-param-keystyle.py

      - name: 依赖策略门（弃维护库引用面 / 声明形状 / 禁入名单）
        # 2026-10-24（A2-a）：本门**不**重复 govulncheck 与 npm audit 的 CVE 面，只守它们
        # 结构上抓不到的三类：弃维护库的引用面是否收敛到一个 seam + 有没有到期复查日、
        # 依赖声明形状（latest/*/URL/相对路径 replace）、禁入名单（无 CVE 也禁）。
        # 自检 10 枚控制（--self-check）随本格同行：判据恒绿与判据恒红都长得像"跑过了"。
        run: |
          python3 scripts/check-dependency-policy.py --self-check
          python3 scripts/check-dependency-policy.py

      - name: SBOM 产物断言——工作流段（三份 SPDX 都被生成、都被上传）
        # 2026-10-24（A2-b）：不需要 syft、不联网，只静态核对 sbom.yml：谁生成、生成到哪、
        # 谁上传、上传的是不是同一批。产物级断言（--dir，对账直接依赖）在 sbom.yml 里跑，
        # 那里 syft 已装、产物已在。
        run: python3 scripts/check-sbom-artifacts.py --self-check && python3 scripts/check-sbom-artifacts.py --workflow

      - name: i18n 真接入占比只许涨不许跌（阻断）
        # 2026-10-11（阶段五 G6）：三条棘轮（真 i18n 键占比 / 中文字面量直传数 /
        # 词条库孤儿数）+ 各语言包齐整。注意本门必须认 $t() 形态——实测 918 个去重键里
        # 716 个走 $t()，只认裸 t() 会漏掉 78% 的使用而且漏得悄无声息。
        run: python3 scripts/check-i18n-coverage.py

      - name: 文本编码门（非 UTF-8 字节 / U+FFFD 替身 / 双重编码签名，阻断）
        # 2026-10-12（阶段五 G7）：本轮在两个已入库文件里各发现一段 U+FFFD——中文注释被某个
        # 「容错写回」的工具折成了替身字符（`user-web/src/layout/Layout.vue:143` 连续 2 个、
        # `user-server/internal/service/config_param_test.go:335` 连续 3 个）。
        # 这类损坏不会编译红、不会测试红、不会页面报错，症状只有"人读到那行时才看得见"，
        # 所以没有发现机制就等于没有。三条判据：严格 UTF-8 解码、U+FFFD 次数（只放行
        # `text-encoding.baseline` 里逐文件登记的刻意用法，变小报 STALE）、双重编码签名
        # （建门时全仓 0 处，故无豁免通道）。牙齿常驻在下一步的用例里（21 枚控制 +
        # 10 枚专杀变异），建门当趟的真树反向对账 14 格是它的来路：三种内容红各一格、
        # 撤探针复绿、基线抬高/撤豁免两向各有判据、缺基线与幽灵登记与空扫描面各退 2、
        # 中文名文件真在面里（不带 `-z` 时 git 会把它们列成转义名⇒静默不扫）。
        # 耗时（2026-10-13 现测，工作树 7247 个路径 / 7228 个文本；影子树 7245 / 7226）：
        # user CPU 两侧都是 1.62–1.69s（工作树 1.69/1.63，影子 1.69/1.62，各测两次）；
        # wall 随页缓存与并发负载摆动（1.95s–6.17s，其中 6.17s 那一趟同机在跑四包 go test），
        # 所以拿 user CPU 当口径。这一步排在 go build 之前，挡在编译前面的还有架构门那一步。
        run: python3 scripts/check-text-encoding.py

      - name: 文本编码门用例（假树夹具 21 枚控制，不联网、不要数据库）
        # 门的 `--self-check` 只喂内存字节夹具，它证的是「检测函数有牙」；而
        # 「豁免按次数正好对上才放行」「基线里的文件读不到必须退 2」「中文名的文件真在面上」
        # 「未跟踪又未忽略的临时件也在面上」「门自己挂在 Makefile 与 CI 两个事件 paths 上」
        # 这些只在真 git 树上才成立的判据，self-check 一条都证不了。
        # 21 枚控制各配一枚专杀变异跑过（`> 基线` 放宽成 `>= 基线` 由 T5 那格抓到、
        # STALE 分支关死由 T7、缺基线/幽灵登记/读不到/空面四格各退 2 由 T8~T11、
        # 二进制嗅探关死由 T15、`-z` 摘掉由 T13b、Makefile 少一步由 T17a、
        # CI paths 少一行由 T17b、CI 没有执行点由 T17c）。
        # 有一处实测与预期不符已写进用例文件头：把 `registered.get(rel, 0)` 换成
        # `10**9` 杀不到 T6——登记过的文件仍走登记值，那条分支要单独杀得改坏比较两侧。
        # 全程在 mktemp 的假 git 树里做，不往工作树写一个字节（工作树里压着别的泳道在途件）。
        run: bash scripts/check-text-encoding.test.sh

      - name: 路由消费面取证器口径自检（10 枚控制，含两条极性对）
        # scripts/route-consumer-triage.py 产出的四档名册是接口废弃判据唯一可重跑的事实源，
        # 文档里的每个计数都由它复算。而它自检的 10 枚控制此前只在人手动跑一次时才响：
        # 提取规则坏掉时名册会静默把「门的夹具／打包器别名」读成消费方——磁盘上留着两例
        # （文件级漏 `mut_*` 锚点、token 级漏 `@/api/x`），两例都是靠人工比对别的名册才发现的。
        # `--self-check` 在定位仓库根之前就返回（不读仓库、不连库、不联网），
        # 两条极性对各测两侧：模块说明符什么都抽不出来 ＋ 同一个串写成真调用照常抽出。
        # 耗时实测 0.04s（mac 出厂 python3，三次取中位）。
        run: python3 scripts/route-consumer-triage.py --self-check

      - name: 菜单×路由×守卫三方对账器口径自检（阻断；枚数由脚本现报）
        # scripts/menu-route-role-audit.py 是能力面表
        # （user-server/internal/model/menu_capability_routes.go）唯一的事实源：LEAK/BLOCK/GLOBAL/
        # PENDING/UNROUTED 五档名册与那张生成件都由它算。它此前只在人手动跑那一天才响，
        # 而它的判据全是文本区间口径——摘掉"挂载区间"那一筛、把 BLOCK 的极性方向写反、
        # UNROUTED 的抽取退化成"整段文件的 /api/ 串"，三样都不会让任何编译或单测变红，
        # 只会让下一轮名册静默少一档或多一档（挂载区间那一刀就是这么漏掉的）。
        # `--self-check` 在定位仓库根之前就返回：不读仓库、不连库、不联网，
        # 夹具里正反两枪各自开火，"逐条对上时放行"那枚反向也在其中。
        run: python3 scripts/menu-route-role-audit.py --self-check

      - name: CI 的 PG 名额与代码侧池上界必须同源
        # §23.21 第 8 段⑤ 的常驻化：此前"CI 容器只有默认名额、代码侧池上界比它大"这件事
        # 只活在人脑和事后翻日志里，于是它以「最后一个开连接的用例随机红」的形式留给别人。
        # 门读三处：本文件 4 枚 services.postgres 的声明、每枚带库作业的现测步骤、
        # 以及 Go 源里那两枚池上界（现读，不手抄）。任何一处漂移即红；读不到源退 2。
        run: python3 scripts/check-ci-pg-capacity.py --repo .

      - name: check-ci-pg-capacity 用例（假树夹具，不联网、不要 docker）
        # 十组（断言**处数**由用例现报，写死的枚数会随格子漂移，见审计文档 §23.25 第 18、19 段）：
        # 正控制齐全绿／摘 command／名额不等／缺现测步骤／只印不判／低于池上界之和／
        # 源文件缺失退 2／上界形状缺失退 2／注释污染派生 grep／REAL 真仓库。
        # 进 CI 的是用例而不只是门：判据退化（例如把"没数到"当成通过）在这里当场红。
        run: bash scripts/check-ci-pg-capacity.test.sh

      - name: go vet
        working-directory: user-server
        run: go vet ./...

      - name: gofmt（格式门禁）
        # 2026-09-16 审计（FMT-01）：新增。
        # 为什么需要独立一步：user-server/.golangci.yml 只启用 govet+depguard
        # （run.tests=false），gofmt 既不在 lint 覆盖内，测试文件更是完全不被 lint。
        # 无门禁 → 格式漂移无人可查，累积 34 个未格式化文件。
        #
        # 直接调 Makefile 里那份 fmt-check 实现：**同一份判据，不再有两处口径**
        # ——自抄判据容易漏掉 stderr（文件解析不了时 gofmt 只往 stderr 报错且 rc=2，
        # 格式门会对着语法坏掉的文件打 ✅）。
        run: make fmt-check

      - name: 安装 golangci-lint（装一次，下面两步共用同一份二进制）
        # 拆成「装 / 校验配置 / 跑分析」三步的原因：action 的 verify（默认 true）在
        # 分析前要用**一次不重试的 HTTPS 请求**去拉
        # https://golangci-lint.run/jsonschema/golangci.v<版本>.jsonschema.json。
        # 实测 2026-10-11 master tip 上本作业整步红：
        #   failing loading "...golangci.v2.10.jsonschema.json": context deadline exceeded
        # 而同一份 user-server/.golangci.yml 在前两笔提交上该校验均为绿 ——
        # 红的是 runner 到 golangci-lint.run 的网络抖动，代码侧无事可修。
        # 装好的二进制对后续步骤可见：action 源码 src/run.ts 在 installOnly 提前返回
        # **之前**执行 core.addPath(path.dirname(binPath))，所以下面的 make 与
        # install-mode: none 都走 PATH，不再各装一份。
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.0
          install-only: true
          working-directory: user-server

      - name: golangci-lint 配置校验（JSON Schema，上限 3 次）
        # 判据与"为什么不干脆 verify: false"全写在 Makefile 的 lint-config-verify
        # 注释里（要点：`golangci-lint run` 对配置里的未知键静默忽略，实测退 3 报错的
        # 只有 config verify，run 照样打 "0 issues."——摘掉这道门等于给 depguard
        # 留一条无声失效的路）。上限 3 次只吸收网络抖动，真配置错三次都红。
        # 版本 pin 只保留在上面安装步骤那一处：Makefile 的 lint-version-check 用
        # awk 取 workflow 里**第一条** `version: vA.B.C` 与本机制品对账，
        # 出现第二份 pin 会让它对着一个不再被使用的值把关。
        run: make lint-config-verify

      - name: golangci-lint（架构护栏 depguard）
        # P0-1：分层依赖方向护栏，规则见 user-server/.golangci.yml
        # 2026-09-19 审计（第二十五轮）：version v2.1.6 → v2.10.0。
        # v2.1.6 官方二进制以 go1.24 构建，而本仓 go.mod 与 .golangci.yml 的 run.go 都是 1.25，
        # 该步在 runner 上从 2026-08-11 起就是 exit 3 抛
        #   can't load config: the Go language version (go1.24) used to build golangci-lint
        #   is lower than the targeted Go version (1.25)
        # 即：errcheck / depguard / staticcheck 五道护栏在 master 上从未执行过，
        # 且它排在 go build 之前，单测、基准、覆盖率、覆盖率阈值四步被连带 skipped。
        # 不选最新 v2.13.2：同一份 HEAD 影子克隆里 v2.10.0 为 0 issues，v2.13.2 另报 6 条
        # 新命中（5 govet + 1 staticcheck），换版本与修存量不应混在一个提交里。
        # 再升 Go 目标版本时，这里的 pin 要一并核对 —— Makefile 的 GOLANGCI_LINT_VERSION
        # 与本行由 `make lint-version-check` 强制对齐（不一致就拒绝跑本地 lint）。
        # 2026-09-29：go.mod/.golangci.yml 升 go1.26 后复核过 pin：v2.10.0 以 go1.26.0 构建
        # ≥ 目标 1.26，config 加载不会再 exit 3。
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none
          verify: false
          working-directory: user-server
          args: --timeout=10m

      - name: go build
        working-directory: user-server
        run: go build ./...

  # ------------------------------------------------------------------
  # 测试解引用门（批M-10 建门、本作业接进 CI）：用例不许在"被调函数能交回
  # (nil, nil)"的返回值上未判空即解引用。判据、口径边界与零条目基线的来路见
  # `scripts/check-test-nil-deref.py` 文件头与 §23.16 第 8 条／§23.17。
  #
  # 为什么是独立 job 而不是 static-gates 的第 9 个步骤：本文件 A3 注释记的就是
  # "同 job 前序一步红 ⇒ 后续步骤全成 skipped"，那道被藏起来的门与坏掉的门长得一样。
  #
  # 触发面：文件头 paths 里的 `scripts/check-test-nil-deref.py` 与
  # `scripts/test-nil-deref.baseline` 两行是本作业的命门 —— 缺了它们，"只改判据"
  # 或"只放宽基线"这类提交根本不会重跑这道门（platform `docs-link-check.yml` 的教训）。
  # 门的输入是整棵 Go 测试树，故 `user-server/**` 必须在（它已在）。
  #
  # 耗时与不遮挡性：本机实测 1.2s（纯 grep/正则，无 DB、无网络、不编译）。
  # 同一版字节在两个树上读数一致（泳道树 & `git archive HEAD` 的只含已提交内容树：
  # `函数键 116 · 确证站点 0 · 存疑 114` ⇒ rc=0），所以它绿不依赖本泳道未推的改动。
  # ------------------------------------------------------------------
  test-nil-deref:
    name: Test nil-deref gate (零条目基线棘轮)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # 用 @v7 而不是本文件其余作业沿用的 @v4：`check-action-runtime.py` 把本文件的
        # checkout@v4 站点数锁在上界 12（R47 抬干净侧后留下的账，理由"并行泳道持有该文件
        # 未提交改动"）。新作业若跟着抄 v4 ⇒ 上界 13 > 12 当场红，而这道门的账只许降不许升。
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 确证站点不得超过基线（新增即红；修掉不划掉也红）
        run: python3 scripts/check-test-nil-deref.py

  # ------------------------------------------------------------------
  # 安全扫描：与静态门/测试互不遮挡。gitleaks 阻断，govulncheck 观测。
  # ------------------------------------------------------------------
  security-scans:
    name: Security scans (gitleaks / govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gitleaks-action 要读提交历史。此前该步骤被上游的死 pin 挡着从未真跑过，
          # 「depth=1 时它到底扫不扫得到东西」没有任何历史证据，而扫不到时它是 exit 0
          # —— 正是最坏的一种假绿。按 gitleaks-action 文档要求显式拉全历史。
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        # OPT-CI-05：密钥扫描（2026-08-16 审计任务）
        # 2026-09-18 转阻断：对全部 git 跟踪文件做高置信度密钥模式
        # （AKIA/ghp_/sk-/PRIVATE KEY/xoxb/AIza）扫描，命中 0 处；
        # "首次启用不阻断"前提已不成立。若未来误报测试夹具，
        # 用仓库根 .gitleaks.toml allowlist 精确豁免，而不是回退本门禁。
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # 钉到补丁号而不是 '1.26'：浮动口径由 setup-go 的版本索引解析，本轮 CI 日志里
          # 解析结果是 go1.26.8；而本轮报出的 12 条 stdlib 通告的 "Fixed in" 正是 go1.26.9，
          # 差一个补丁号就整批仍判「可达」——这道门禁红，红的却不是本仓代码。
          # 升档时同步改 user-server/go.mod 的 toolchain，别留两个版本源。
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: user-server/go.sum

      - name: Go dependency audit (govulncheck)
        # OPT-CI-04：依赖漏洞审计（2026-08-16 审计任务）
        # 2026-09-18 评估后维持不阻断（与 gitleaks/npm audit 不同）：
        #   ① go1.25.13 工具链下 `govulncheck@latest`(v1.8.0) 无法安装——其要求 go>=1.26.0，
        #      CI parity 扫描直接 exit 1，门禁尚未运行即失败，与代码无关；
        #   ② 本地 go1.26.0 扫描测得 26 个「可达」stdlib 漏洞（crypto/x509 等），
        #      仅在 go1.26.1 修复，非本仓库可编辑消除，转阻断会立即红。
        # 2026-09-29：前置条件已满足——setup-go 升 1.26（解析到 1.26.x ≥ 1.26.1，stdlib 26 条已修），
        # govulncheck@latest(v1.8.0, 要求 go≥1.26) 可安装；依赖侧 edwards25519 已升 v1.2.0（包级归零），
        # x/crypto ssh/openpgp 为不可达模块级项（本仓仅用 bcrypt）。故按既定计划转阻断（去 continue-on-error）。
        working-directory: user-server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ------------------------------------------------------------------
  # -race：拆成 core + service 两片。
  # internal/service 单独成 job 的原因（本轮 CI 日志实测）：它是唯一撞过
  # `-timeout 300s` panic 的包（8b253b5a run：`FAIL hivemtk-user/internal/service
  # 300.056s` + `panic: test timed out after 5m0s`），本地不带 -race 就要 452~567s，
  # 和其余 152 个包（-race 合计 532s）共用一个 per-package timeout 只会两边都将就：
  # 要么包被 timeout 掐死，要么 job 白等。拆开各按自己的耗时定预算。
  # ------------------------------------------------------------------
  test-race-core:
    name: Unit tests -race (user-server core)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 测试 PG 用 fsync=off：CI 的 postgres 是临时容器，数据不需要持久化；
    # 直接消掉 TRUNCATE 的 DataFileImmediateSync 等待。本地等价物见
    # docker-compose.test.yml（mtk-postgres-test，端口 8217）。
    services:
      postgres:
        image: pgvector/pgvector:pg15
        # 显式名额。不写这一行 ⇒ 容器用镜像默认值，而代码侧的池上界比它大
        # （生产 DefaultPoolConfig.MaxOpenConns ＋ testutil 夹具），整片跑就会以
        # 「最后一个开连接的用例随机红」的形态撞上 too many clients / SQLSTATE 53300。
        # 数字不许只改这一处：本作业末尾那步「现测 PG 名额」从本文件派生 want，
        # 常驻门 scripts/check-ci-pg-capacity.py 核对声明值 ≥ 代码侧池上界之和。
        command: '-c max_connections=400 -c fsync=off -c synchronous_commit=off -c full_page_writes=off'
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: marketing_tools
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d marketing_tools"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: user-server/go.sum

      - name: 现测 PG 名额（容器读到的数才是证据，YAML 里写的只是意图）
        # §23.21 第 2 段那条「本地按不下去的红」＝服务名额与代码侧池上界不同源。
        # 上面声明的那枚名额如果没被真测过，跟没写一样：postgres 镜像的 entrypoint
        # 只在没有用户命令时才用默认参数，任何一处形状写错都会静默回落。
        # want 用 grep 从本文件派生，不再手抄第二份数字（抄的那份不会跟着改）。
        # 判据常驻：scripts/check-ci-pg-capacity.py（make audit ＋ static-gates 作业）。
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { echo "::error::runner 上没有 psql ⇒ 名额没被现测，这一步不许静默放行"; exit 1; }
          want=$(grep -m1 -oE 'max_connections=[0-9]+' .github/workflows/user-server-ci.yml | cut -d= -f2)
          got=$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'show max_connections')
          if [ "$got" != "$want" ]; then
            echo "::error::PG 容器名额 ${got} ≠ 工作流声明的 ${want} ⇒ 代码侧池上界会撞 too many clients"
            exit 1
          fi
          echo "PG 名额现测 ${got}，与本文件声明一致"

      - name: Run unit tests (with -race)
        working-directory: user-server
        # 分片判据用 grep -x（整行精确匹配），不是 grep -v internal/service：
        # 后者会把 internal/service/churn 等 9 个子包一起赶出 core 片，
        # 而它们个个很快，留在 core 里更均衡。
        run: |
          set -euo pipefail
          go list ./... | grep -vx 'hivemtk-user/internal/service' | sort > pkgs.txt
          echo "本分片包数：$(wc -l < pkgs.txt | tr -d ' ') / 全仓 $(go list ./... | wc -l | tr -d ' ')"
          rc=0
          # -p 1 是硬要求：用例共享同一批测试库槽位（见 testutil procTestDBSlots），
          # 并发跑会互相认领对方的行（reply_guard 认领表 / delayed-<id> 撞自增主键）。
          # -timeout 900s：core 片最慢的包是 browser_automation/service 98s（本轮实测），
          # 900s ≈ 9 倍余量；不再沿用 300s，那个值连 internal/service 都不够。
          go test $(cat pkgs.txt) -count=1 -timeout 900s -p 1 -short -race 2>&1 | tee go-test.log || rc=$?
          # 包完整性断言：go test 对每个包都会落一行 ok/FAIL/? [no test files]。
          # 少了行 = 有包没跑（超时截断/panic/构建中断），必须点名，不能只给个红叉。
          awk '/^(ok|FAIL|\?)[[:space:]]/{print $2}' go-test.log | sort -u > reported.txt
          missing=$(comm -23 pkgs.txt reported.txt || true)
          if [ -n "$missing" ]; then
            echo "::error::以下包没有产生任何结果（套件被掐断，这些包本轮等于没测）："
            echo "$missing"
            exit 1
          fi
          exit $rc

      - name: 菜单×路由×守卫三方对账（全量读数，阻断）
        # static-gates 里那一步只跑 `--self-check`（内存夹具，定位仓库根之前就返回，不读仓库）。
        # 这一步跑真读数：live 守卫档位由 internal/router 的导出用例现打 ⇒ 必须挂在带
        # postgres 的作业末尾，静态线里跑只会得到恒 rc=2 的哑门。它拦的三样编译／单测／lint
        # 全都不会红：
        #   ① 生成件 menu_capability_routes.go 与再生成结果不再逐字相同（手改，或改了
        #      menu.go／注册点／前端调用图却没重跑 `--emit-go`）；
        #   ② 整页死冒出一条（菜单授给非超管、页面挂载即打仅超管口 ⇒ 角色点进去是空表＋403），
        #      以及页内残余与 scripts/menu-block-residual.baseline 逐条对不上（名册有基线没有、
        #      基线有名册没有、条目没理由）；
        #   ③ UNROUTED：`user-web/src/api/` 在打一条 live 表里没有的口（页面一调就 404）。
        # `--out` 指到 RUNNER_TEMP：CI 这轮的名册是判据的中间产物而不是留存的取证，
        # 工作树要保持干净（往仓库树里写未提交残骸会让后面的门读到不属于提交的东西）。
        run: |
          set -euo pipefail
          python3 scripts/menu-route-role-audit.py \
            --check-go user-server/internal/model/menu_capability_routes.go \
            --out "$RUNNER_TEMP/menu-route-audit"

  test-race-service:
    name: Unit tests -race (user-server service)
    runs-on: ubuntu-latest
    # 单包 job 也要给足：per-package -timeout 与 job timeout 谁先到都会截断，
    # 45 min = 本地非 race 最慢观测（567s）的 ~4.7 倍，够 -race 与 runner 挤占。
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg15
        # 显式名额。不写这一行 ⇒ 容器用镜像默认值，而代码侧的池上界比它大
        # （生产 DefaultPoolConfig.MaxOpenConns ＋ testutil 夹具），整片跑就会以
        # 「最后一个开连接的用例随机红」的形态撞上 too many clients / SQLSTATE 53300。
        # 数字不许只改这一处：本作业末尾那步「现测 PG 名额」从本文件派生 want，
        # 常驻门 scripts/check-ci-pg-capacity.py 核对声明值 ≥ 代码侧池上界之和。
        command: '-c max_connections=400 -c fsync=off -c synchronous_commit=off -c full_page_writes=off'
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: marketing_tools
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d marketing_tools"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: user-server/go.sum

      - name: 现测 PG 名额（容器读到的数才是证据，YAML 里写的只是意图）
        # §23.21 第 2 段那条「本地按不下去的红」＝服务名额与代码侧池上界不同源。
        # 上面声明的那枚名额如果没被真测过，跟没写一样：postgres 镜像的 entrypoint
        # 只在没有用户命令时才用默认参数，任何一处形状写错都会静默回落。
        # want 用 grep 从本文件派生，不再手抄第二份数字（抄的那份不会跟着改）。
        # 判据常驻：scripts/check-ci-pg-capacity.py（make audit ＋ static-gates 作业）。
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { echo "::error::runner 上没有 psql ⇒ 名额没被现测，这一步不许静默放行"; exit 1; }
          want=$(grep -m1 -oE 'max_connections=[0-9]+' .github/workflows/user-server-ci.yml | cut -d= -f2)
          got=$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'show max_connections')
          if [ "$got" != "$want" ]; then
            echo "::error::PG 容器名额 ${got} ≠ 工作流声明的 ${want} ⇒ 代码侧池上界会撞 too many clients"
            exit 1
          fi
          echo "PG 名额现测 ${got}，与本文件声明一致"

      - name: Run unit tests (with -race)
        working-directory: user-server
        run: |
          set -euo pipefail
          go list ./... | grep -x 'hivemtk-user/internal/service' | sort > pkgs.txt
          n=$(wc -l < pkgs.txt | tr -d ' ')
          if [ "$n" != "1" ]; then
            echo "::error::分片判据失效：internal/service 整行匹配到 $n 个包（应为 1），两片之和不再覆盖全仓"
            exit 1
          fi
          rc=0
          go test $(cat pkgs.txt) -count=1 -timeout 2400s -p 1 -short -race 2>&1 | tee go-test.log || rc=$?
          awk '/^(ok|FAIL|\?)[[:space:]]/{print $2}' go-test.log | sort -u > reported.txt
          missing=$(comm -23 pkgs.txt reported.txt || true)
          if [ -n "$missing" ]; then
            echo "::error::internal/service 没有产生结果（被超时截断），本轮等于没测"
            exit 1
          fi
          exit $rc

  # ------------------------------------------------------------------
  # 覆盖率 + 阈值 + Codecov：三者必须在同一 job（profile 是 job 本地文件）。
  # 不与 -race 合趟：合趟后任一片红就把整份 profile 拖残，阈值门会跟着假红，
  # 两个互不相干的结论被绑成一个 —— 拆 job 的目的正是解掉这种耦合。
  # ------------------------------------------------------------------
  coverage:
    name: Coverage (user-server)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg15
        # 显式名额。不写这一行 ⇒ 容器用镜像默认值，而代码侧的池上界比它大
        # （生产 DefaultPoolConfig.MaxOpenConns ＋ testutil 夹具），整片跑就会以
        # 「最后一个开连接的用例随机红」的形态撞上 too many clients / SQLSTATE 53300。
        # 数字不许只改这一处：本作业末尾那步「现测 PG 名额」从本文件派生 want，
        # 常驻门 scripts/check-ci-pg-capacity.py 核对声明值 ≥ 代码侧池上界之和。
        command: '-c max_connections=400 -c fsync=off -c synchronous_commit=off -c full_page_writes=off'
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: marketing_tools
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d marketing_tools"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: user-server/go.sum

      - name: 现测 PG 名额（容器读到的数才是证据，YAML 里写的只是意图）
        # §23.21 第 2 段那条「本地按不下去的红」＝服务名额与代码侧池上界不同源。
        # 上面声明的那枚名额如果没被真测过，跟没写一样：postgres 镜像的 entrypoint
        # 只在没有用户命令时才用默认参数，任何一处形状写错都会静默回落。
        # want 用 grep 从本文件派生，不再手抄第二份数字（抄的那份不会跟着改）。
        # 判据常驻：scripts/check-ci-pg-capacity.py（make audit ＋ static-gates 作业）。
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { echo "::error::runner 上没有 psql ⇒ 名额没被现测，这一步不许静默放行"; exit 1; }
          want=$(grep -m1 -oE 'max_connections=[0-9]+' .github/workflows/user-server-ci.yml | cut -d= -f2)
          got=$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'show max_connections')
          if [ "$got" != "$want" ]; then
            echo "::error::PG 容器名额 ${got} ≠ 工作流声明的 ${want} ⇒ 代码侧池上界会撞 too many clients"
            exit 1
          fi
          echo "PG 名额现测 ${got}，与本文件声明一致"

      - name: Coverage (Go)
        # 2026-08-15 P0-CI：覆盖率采集（包含 -cover.out 上传 Codecov）
        # 2026-09-20（A3）：-timeout 300s → 2400s —— 300s 连 internal/service 单包都不够，
        # 被掐断的包不写进 profile，覆盖率会莫名其妙掉、然后由阈值门报成"测试退步"。
        working-directory: user-server
        run: |
          set -euo pipefail
          mkdir -p coverage
          go list ./... | sort > pkgs.txt
          # 完整性断言的期望集合只能是「有测试文件的包」：开了 -coverprofile 之后，
          # 无测试包不再打 `?   pkg [no test files]`，而是
          # `\t pkg \t\tcoverage: 0.0% of statements`（行首是制表符），
          # 下面那条 awk 三个行首锚点都匹配不上 ⇒ 11 个 cmd/* 会被点名成
          # "未产生结果"（run 35467723878 实测），把真信号淹在假红里。
          go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... | sort > testable.txt
          rc=0
          go test $(cat pkgs.txt) -count=1 -timeout 2400s -p 1 -short \
            -coverprofile=coverage/go-cover.out -covermode=atomic 2>&1 | tee go-test.log || rc=$?
          awk '/^(ok|FAIL|\?)[[:space:]]/{print $2}' go-test.log | sort -u > reported.txt
          missing=$(comm -23 testable.txt reported.txt || true)
          if [ -n "$missing" ]; then
            echo "::error::以下包未产生结果，profile 不完整（覆盖率数字不可信）："
            echo "$missing"
            exit 1
          fi
          go tool cover -func=coverage/go-cover.out | tail -1
          exit $rc

      - name: Coverage threshold (OPT-CI-06)
        # OPT-CI-06：覆盖率门禁，分两层：
        #   1) FLOOR（阻断）：低于回归底线即失败，防止覆盖率倒退
        #   2) TARGET（仅提示）：产品目标 60%，差距如实打印、不掩盖
        # 提升路径：随测试补齐逐步上调 FLOOR（22 → 30 → 40 → 50 → 60）。
        # 注意：不得为了让 CI 变绿而下调 FLOOR。
        # if: always() —— 上一步有用例红时 profile 依然是完整的
        # （包完整性断言已保证不缺包，go test 对失败包照样写覆盖数据），
        # 阈值结论不该被测试红一起吞掉；但缺 profile 时必须显式报错，
        # 不能让 `go tool cover` 的 "no such file" 被读成"覆盖率为 0"。
        if: always()
        working-directory: user-server
        run: |
          set -euo pipefail
          if [ ! -s coverage/go-cover.out ]; then
            echo "::error::coverage/go-cover.out 缺失或为空 —— 这是「没测到」，不是「覆盖率为 0」，别按覆盖率退步归因"
            exit 1
          fi
          TOTAL=$(go tool cover -func=coverage/go-cover.out | tail -1 | awk '{print $3}' | sed 's/%//')
          FLOOR=20     # 阻断底线（回归保护）
          TARGET=60    # 产品目标（OPT-CI-06 原始要求）

          echo "Total coverage : ${TOTAL}%"
          echo "Blocking floor : ${FLOOR}%"
          echo "Product target : ${TARGET}%  (未达成，差距 $((TARGET - ${TOTAL%.*})) 个百分点)"

          if awk "BEGIN {exit !($TOTAL < $FLOOR)}"; then
            echo "::error::覆盖率 ${TOTAL}% 低于回归底线 ${FLOOR}%，构建失败"
            echo "::error::请补齐测试后再提交；不得下调 FLOOR 以求通过。"
            exit 1
          fi
          if awk "BEGIN {exit !($TOTAL < $TARGET)}"; then
            echo "::warning::覆盖率 ${TOTAL}% 未达产品目标 ${TARGET}%（当前为阻断底线 ${FLOOR}%）"
          fi

      - name: 核心域分档覆盖率（每个核心包自己的底线，棘轮只许涨）
        # 2026-10-24（A4-a）：上面那道 OPT-CI-06 的口径是**全仓一个数**，于是「核心包掉
        # 20 个点、边缘包涨回来」整体不变 ⇒ 门绿灯，而真正会赔钱的地方没人测了。
        # 本门把覆盖率拆成一组数：internal/{service,repository,controller,model,reach,
        # approval,browser_automation,aiagent} 各一条底线，只许涨不许跌。
        # 基线 scripts/core-coverage.baseline 是棘轮：--refresh 只上调；真下调要
        # --allow-drop <包名> 并在提交信息里签字。
        # 没有 profile 时本门退 2（不冒充绿）——上一步已断言 profile 存在且包齐整。
        if: always()
        run: |
          python3 scripts/check-core-coverage.py --self-check
          python3 scripts/check-core-coverage.py --profile user-server/coverage/go-cover.out

      - name: Upload coverage to Codecov
        # 2026-08-15 P0-CI：Codecov 集成（需在仓库 settings 配置 CODECOV_TOKEN）
        #
        # 注意分工（OPT-CI-06 修复后）：
        #   覆盖率「门禁」由上方 "Coverage threshold (OPT-CI-06)" 步骤承担（阻断式）。
        #   本步骤只负责「上传报告供趋势查看」，故 fail_ci_if_error 保持 false ——
        #   缺 CODECOV_TOKEN 时不应让构建失败。codecov 侧策略见仓库根 codecov.yml。
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v4
        with:
          files: user-server/coverage/go-cover.out
          flags: go
          name: user-server-coverage
          fail_ci_if_error: false  # 缺 token 时不阻断；本地可跑

  # ------------------------------------------------------------------
  # 基准：P0-5 性能基线（要读真实表，需要 postgres）。
  # ------------------------------------------------------------------
  benchmark:
    name: Benchmarks (P0-5 性能基线)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg15
        # 显式名额。不写这一行 ⇒ 容器用镜像默认值，而代码侧的池上界比它大
        # （生产 DefaultPoolConfig.MaxOpenConns ＋ testutil 夹具），整片跑就会以
        # 「最后一个开连接的用例随机红」的形态撞上 too many clients / SQLSTATE 53300。
        # 数字不许只改这一处：本作业末尾那步「现测 PG 名额」从本文件派生 want，
        # 常驻门 scripts/check-ci-pg-capacity.py 核对声明值 ≥ 代码侧池上界之和。
        command: '-c max_connections=400 -c fsync=off -c synchronous_commit=off -c full_page_writes=off'
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: marketing_tools
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d marketing_tools"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: user-server/go.sum

      - name: 现测 PG 名额（容器读到的数才是证据，YAML 里写的只是意图）
        # §23.21 第 2 段那条「本地按不下去的红」＝服务名额与代码侧池上界不同源。
        # 上面声明的那枚名额如果没被真测过，跟没写一样：postgres 镜像的 entrypoint
        # 只在没有用户命令时才用默认参数，任何一处形状写错都会静默回落。
        # want 用 grep 从本文件派生，不再手抄第二份数字（抄的那份不会跟着改）。
        # 判据常驻：scripts/check-ci-pg-capacity.py（make audit ＋ static-gates 作业）。
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { echo "::error::runner 上没有 psql ⇒ 名额没被现测，这一步不许静默放行"; exit 1; }
          want=$(grep -m1 -oE 'max_connections=[0-9]+' .github/workflows/user-server-ci.yml | cut -d= -f2)
          got=$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'show max_connections')
          if [ "$got" != "$want" ]; then
            echo "::error::PG 容器名额 ${got} ≠ 工作流声明的 ${want} ⇒ 代码侧池上界会撞 too many clients"
            exit 1
          fi
          echo "PG 名额现测 ${got}，与本文件声明一致"

      - name: Run go benchmarks (P0-5 性能基线)
        # 仅跑 P0-5 性能基线（500 条 IN 翻转 < 200ms 阈值），bench 默认只跑 1 次耗时短
        working-directory: user-server
        run: go test -run=^$ -bench=BenchmarkAckOutboundDeliveredBatchReturningWithStatus_500_P0_5 -benchtime=1x -timeout 900s ./internal/repository/

  # ------------------------------------------------------------------
  # user-web 三个关注点各自成 job：原先 ESLint 一红就把 npm audit 和
  # `npm run build` 一起 skip 掉（本轮实测：一条 no-useless-assignment 令
  # 「前端能否构建」这道门连续多次没有结论）。
  # ------------------------------------------------------------------
  user-web-eslint:
    name: ESLint (user-web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: user-web/package-lock.json

      - name: npm ci
        working-directory: user-web
        run: npm ci

      - name: ESLint (OPT-FE-01)
        # OPT-FE-01：user-web 主项目 ESLint 接入 CI。
        # 阻断式门禁：`eslint .` 全仓 0 errors（warnings 不阻断），有 error 即红。
        working-directory: user-web
        run: npm run lint:check --if-present

  user-web-security:
    name: npm audit (user-web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: user-web/package-lock.json

      - name: npm ci
        working-directory: user-web
        run: npm ci

      - name: npm audit (OPT-CI-10)
        # OPT-CI-10：NPM 依赖漏洞扫描，仅阻断 high/critical（moderate/low 只报不挡）。
        # 2026-09-19 审计（第二十五轮）重写。原写法在 runner 上恒定红且**零覆盖**：
        # npm 10 打的是 /-/npm/v1/security/audits/quick，runner 日志里 npm 自己已经提示
        # 「This endpoint is being retired. Use the bulk advisory endpoint instead」，返回
        #   400 Invalid package tree, run `npm install` to rebuild your package-lock.json
        # 而 --json 那次把这份错误对象当成审计报告解析，打出
        #   high: 0 critical: 0 total: 0
        # —— 看着像「扫过了、没漏洞」，实际一个依赖都没查。本地用 npm 10.8.2 / 10.9.0 /
        # 11.x + 官方 registry + CI 同形 node_modules 都复现不出该 400，故按 runner 侧
        # 事实处理：改走 bulk advisories 端点（npm ≥ 11），并加覆盖数下限校验。
        # 三点固定：① npx 装到临时目录，不动 job 内的全局 npm（原本是为后面的
        # `npm run build` 留的；build 已拆到独立 job，但这条隔离仍值得保留）；
        # ② 显式官方 registry —— npmmirror 的 /-/npm/v1/security/*
        # 是 404 NOT_IMPLEMENTED，换镜像等于换回零覆盖；③ dependencies.total=0 直接
        # exit 2，绝不与「无漏洞」同形。
        working-directory: user-web
        run: |
          export npm_config_registry=https://registry.npmjs.org
          npx --yes npm@11 audit --audit-level=high --json > npm-audit.json 2>/dev/null || true
          node -e '
            const fs = require("fs");
            let r;
            try { r = JSON.parse(fs.readFileSync("npm-audit.json", "utf8")); }
            catch (e) {
              console.error("::error::npm audit 拿不到 JSON 报告（端点或网络故障），本步骤零覆盖：" + e.message);
              process.exit(2);
            }
            const md = r.metadata || {}, v = md.vulnerabilities || {}, deps = (md.dependencies || {}).total;
            if (!deps) {
              console.error("::error::npm audit 未返回依赖树（dependencies.total=0），本步骤零覆盖："
                + JSON.stringify(r).slice(0, 300));
              process.exit(2);
            }
            console.log(`已审计依赖 ${deps} 个：critical ${v.critical || 0} / high ${v.high || 0}`
              + ` / moderate ${v.moderate || 0} / low ${v.low || 0}`);
          '
          # 再跑一次可读报告：high/critical 命中时由此步骤码阻断
          npx --yes npm@11 audit --audit-level=high
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload npm audit report
        # 将 JSON 报告上传为 artifact，便于 review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: user-web-npm-audit
          path: user-web/npm-audit.json
          if-no-files-found: ignore
          retention-days: 30

  user-web-build:
    name: Build (user-web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: user-web/package-lock.json

      - name: npm ci
        working-directory: user-web
        run: npm ci

      - name: Build
        working-directory: user-web
        run: npm run build

  bridge-extension-test:
    # HiveBridge 扩展 vitest（协议/限速/sanitize/fallback 51 用例）
    name: Bridge Extension Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: user-web/bridge/package-lock.json

      - name: npm ci
        working-directory: user-web/bridge
        run: npm ci

      - name: vitest
        working-directory: user-web/bridge
        run: npx vitest run --reporter=default

      - name: ESLint (P0-CI)
        # 2026-08-15 P0-CI：开启前端 ESLint
        # eslint.config.mjs 在 user-web/bridge/，npm ci 已安装依赖
        # 2026-09-18 转阻断：原"首次启用不阻断"约定到期。实测本地
        # `npm run lint` = 0 errors / 69 warnings（warn 不阻断），满足门禁条件。
        # warnings 清零属独立议题，勿在此阻断。
        working-directory: user-web/bridge
        run: npm run lint --if-present

      - name: vitest coverage
        # 2026-08-15 P0-CI：前端覆盖率采集
        working-directory: user-web/bridge
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text
        continue-on-error: true  # 缺 c8/v8 配置时不阻断

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v4
        with:
          files: user-web/bridge/coverage/lcov.info
          flags: bridge
          name: bridge-coverage
          fail_ci_if_error: false

  embed-sdk-lint:
    name: Lint (embed-sdk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: embed-sdk/package-lock.json

      - name: npm ci
        working-directory: embed-sdk
        run: npm ci

      # 测试读取的是 IIFE 构建产物 dist/marketing-chat-widget.iife.js（见
      # test/unit.test.mjs 与 boundary.test.mjs 的 IIFE_PATH），必须先 build。
      # 原 job 只有 npm ci + npm test，因此每次都以
      # 「IIFE 产物不存在,请先执行 npm run build」exit 1 失败。
      - name: Build
        working-directory: embed-sdk
        run: npm run build

      # 用 test:all 而非 test：boundary.test.mjs 同样读取 IIFE 产物，且覆盖
      # open/close/toggle 循环、重复 init、超大消息体、危险协议 origin 等边界，
      # 原 job 只跑 unit 会漏掉这一整组断言。两者均为纯 Node mock，无网络依赖。
      - name: Test (unit + boundary)
        working-directory: embed-sdk
        run: npm run test:all

  api-inventory:
    # 2026-09-16 更正（RISK-06）：原名 "API Inventory Compare"，但它从不比对 ——
    # 只产出清单快照、不设门禁。真正的阻断式契约门禁在 api-contract.yml
    # （audit_api_contract.py --strict）。此处按实际行为改名，避免误导。
    name: API Inventory Report (non-blocking)
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate API inventory
        run: bash scripts/api-inventory.sh
      - name: Upload inventory
        uses: actions/upload-artifact@v7
        with:
          name: api-inventory
          path: api-inventory.md
