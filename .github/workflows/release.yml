# Release 工作流（2026-08-15 M4-P1-O11/O12 增强）
#
# 触发：tag 推送 (v*) 或手动触发
# 功能：
#   - 多架构 Docker 镜像构建（amd64 + arm64）
#   - 推送到 GHCR
#   - SBOM 生成（SPDX 格式）
#   - 镜像签名（cosign keyless 模式）
#   - 创建 GitHub Release 附 SBOM + Bridge 扩展 zip
#   - 镜像安全扫描（trivy）

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write  # cosign keyless 需要 OIDC token
  attestations: write  # sigstore 证明
  security-events: write  # 扫描结果上传

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # 1. Docker 镜像构建 + 推送
  # ============================================================
  build-and-push:
    name: Build & Push (multi-arch)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=dev
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_SHORT=${VERSION%%.*}" >> $GITHUB_OUTPUT

      - name: Build & push user-server
        uses: docker/build-push-action@v5
        with:
          context: ./user-server
          file: ./user-server/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/user-server:${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/user-server:${{ steps.version.outputs.VERSION_SHORT }}-${{ matrix.arch }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/user-server:latest-${{ matrix.arch }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Cosign 签名（keyless）
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # 使用 GitHub OIDC token 进行无密钥签名
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/user-server@${{ steps.buildkit.outputs.digest }}

  # ============================================================
  # 2. Bridge 扩展打包
  # ============================================================
  build-bridge:
    name: Build Bridge Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: user-web/bridge/package-lock.json

      - name: Install dependencies
        working-directory: user-web/bridge
        run: npm ci

      - name: Build extension
        working-directory: user-web/bridge
        run: npm run build

      - name: Package as ZIP
        working-directory: user-web/bridge
        run: |
          mkdir -p dist-zip
          cd dist
          zip -r ../dist-zip/bridge-${{ github.ref_name }}.zip . -x "*.map"
          shasum -a 256 ../dist-zip/bridge-${{ github.ref_name }}.zip | awk '{print $1}' > ../dist-zip/bridge-${{ github.ref_name }}.zip.sha256

      - name: Upload Bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-extension
          path: user-web/bridge/dist-zip/

  # ============================================================
  # 3. SBOM 生成（SPDX 格式 + 多语言）
  # ============================================================
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (Go)
        working-directory: user-server
        run: |
          syft scan dir:. -o spdx-json=../sbom-go.spdx.json

      - name: Generate SBOM (Bridge)
        working-directory: user-web/bridge
        run: |
          syft scan dir:. -o spdx-json=../../sbom-bridge.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-go.spdx.json
            sbom-bridge.spdx.json
          retention-days: 90

  # ============================================================
  # 4. 镜像安全扫描（Trivy）
  # ============================================================
  scan-image:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/user-server:latest-amd64
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ============================================================
  # 5. 创建 GitHub Release
  # ============================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-bridge, generate-sbom]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Bridge artifact
        uses: actions/download-artifact@v8
        with:
          name: bridge-extension
          path: artifacts/

      - name: Download SBOM artifact
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom/

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=dev
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        uses: release-drafter/release-drafter@v6
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
          body: |
            ## HiveMtk ${{ steps.version.outputs.VERSION }}

            详见 [CHANGELOG.md](../../blob/master/CHANGELOG.md)

            ### 下载

            - **user-server 镜像**：`docker pull ghcr.io/${{ github.repository }}/user-server:${{ steps.version.outputs.VERSION }}-amd64`
            - **Bridge 扩展 ZIP**：见下方附件
            - **SBOM**：见下方附件（SPDX 格式）

            ### 校验

            ```bash
            # 校验 Bridge zip SHA256
            sha256sum bridge-${{ steps.version.outputs.VERSION }}.zip
            # 与 .sha256 文件对比

            # 验证镜像签名（cosign keyless）
            cosign verify ghcr.io/${{ github.repository }}/user-server:${{ steps.version.outputs.VERSION }}-amd64 \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
            ```
          files: |
            artifacts/bridge-${{ steps.version.outputs.VERSION }}.zip
            artifacts/bridge-${{ steps.version.outputs.VERSION }}.zip.sha256
            sbom/sbom-go.spdx.json
            sbom/sbom-bridge.spdx.json
