# Release 工作流（2026-08-15 M4-P1-O11/O12 增强；2026-09-19 第二十二轮清理镜像链残留）
#
# 触发：tag 推送 (v*) 或手动触发
# 功能：
#   - Bridge 扩展打包（zip + sha256）
#   - SBOM 生成（SPDX 格式，Go / Bridge 两个模块）
#   - 创建 GitHub Release 附 SBOM + Bridge 扩展 zip
#
# 镜像链（多架构 Docker 构建 + cosign 签名 + trivy 扫描）已删除：
#   94415060「重构宿主机部署」删掉 user-server/Dockerfile（部署形态改为
#   Docker 仅数据层 + 宿主机二进制），本工作流未同步清理 —— build-and-push 指向
#   不存在的 Dockerfile、cosign 步骤引用不存在的 step id（digest 取到空串）、
#   scan-image 扫描一个永不再产出的镜像。三者叠加 = 任何 tag 推送必然整链失败。
#   恢复镜像发行时：先补回 Dockerfile，再重建这三段（digest 必须由带 id: 的
#   build-push 步骤引出，不能凭空引用）。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================
  # 1. Bridge 扩展打包
  # ============================================================
  build-bridge:
    name: Build Bridge Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: user-web/bridge/package-lock.json

      - name: Install dependencies
        working-directory: user-web/bridge
        run: npm ci

      - name: Build extension
        working-directory: user-web/bridge
        run: npm run build

      - name: Package as ZIP
        working-directory: user-web/bridge
        run: |
          mkdir -p dist-zip
          cd dist
          zip -r ../dist-zip/bridge-${{ github.ref_name }}.zip . -x "*.map"
          shasum -a 256 ../dist-zip/bridge-${{ github.ref_name }}.zip | awk '{print $1}' > ../dist-zip/bridge-${{ github.ref_name }}.zip.sha256

      - name: Upload Bridge artifact
        uses: actions/upload-artifact@v7
        with:
          name: bridge-extension
          path: user-web/bridge/dist-zip/

  # ============================================================
  # 2. SBOM 生成（SPDX 格式 + 多语言）
  # ============================================================
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (Go)
        working-directory: user-server
        run: |
          syft scan dir:. -o spdx-json=../sbom-go.spdx.json

      - name: Generate SBOM (Bridge)
        working-directory: user-web/bridge
        run: |
          syft scan dir:. -o spdx-json=../../sbom-bridge.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom-go.spdx.json
            sbom-bridge.spdx.json
          retention-days: 90

  # ============================================================
  # 3. 创建 GitHub Release
  # ============================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-bridge, generate-sbom]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Bridge artifact
        uses: actions/download-artifact@v8
        with:
          name: bridge-extension
          path: artifacts/

      - name: Download SBOM artifact
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom/

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=dev
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        uses: release-drafter/release-drafter@v7
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
          body: |
            ## HiveMtk ${{ steps.version.outputs.VERSION }}

            详见 [CHANGELOG.md](../../blob/master/CHANGELOG.md)

            ### 下载

            - **Bridge 扩展 ZIP**：见下方附件
            - **SBOM**：见下方附件（SPDX 格式）

            ### 校验

            ```bash
            # 校验 Bridge zip SHA256
            sha256sum bridge-${{ steps.version.outputs.VERSION }}.zip
            # 与 .sha256 文件对比
            ```
          files: |
            artifacts/bridge-${{ steps.version.outputs.VERSION }}.zip
            artifacts/bridge-${{ steps.version.outputs.VERSION }}.zip.sha256
            sbom/sbom-go.spdx.json
            sbom/sbom-bridge.spdx.json
