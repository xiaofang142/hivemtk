# 文档治理检查（OPT-DOC-13 / OPT-DOC-14 / OPT-DOC-15）
#
# 背景：这三个脚本此前**均已实现但未接入任何 workflow**，
# 等于「写了检查但从不执行」。本 workflow 将其接入 CI。
#
# 各步骤定位：
#   - check-doc-consistency.sh       阻断：文档引用/ADR 编号/CODEOWNERS 路径/关键文件存在性
#   - check-feature-doc.sh           阻断：功能文档 8 节模板结构（必填节）
#   - feature-doc-coverage-report.sh 仅报告：模板覆盖率是**产品目标**而非回归底线，故不阻断
#                                    （2026-09-16：三处脚本的节判定已统一到
#                                     scripts/lib/feature-doc-sections.sh，修掉「正文/表格里
#                                     提到节名就算通过」的假绿，当前覆盖率 100%）
#
# 注：脚本按「工作区布局」编写（`../..` = 工作区根，其下含 hivemtk/ 与 docs/）。
# 在 GitHub Actions 中仓库被 checkout 到 `<work>/<repo>/<repo>`，故 `../..`
# 恰好等于仓库上一级、其下存在 `hivemtk/`，布局成立；工作区级文档
# （docs/governance、docs/architecture）不在仓库内，脚本已自动跳过该类条目。
name: Docs Consistency

on:
  push:
    branches: [master, main]
    paths:
      - 'docs/**'
      - 'scripts/check-doc-consistency.sh'
      - 'scripts/check-feature-doc.sh'
      - 'scripts/feature-doc-coverage-report.sh'
      - 'scripts/check-no-xapptool.sh'
      - 'scripts/check-no-xapptool.test.sh'
      - 'CODEOWNERS'
      - '.github/workflows/docs-consistency.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check-doc-consistency.sh'
      - 'scripts/check-feature-doc.sh'
      - 'scripts/feature-doc-coverage-report.sh'
      - 'scripts/check-no-xapptool.sh'
      - 'scripts/check-no-xapptool.test.sh'
      - 'CODEOWNERS'
      - '.github/workflows/docs-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-consistency:
    name: 文档一致性 + 模板结构
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 文档引用一致性（OPT-DOC-15）
        run: bash scripts/check-doc-consistency.sh

      - name: 功能文档 8 节模板结构（OPT-DOC-13）
        run: bash scripts/check-feature-doc.sh

      - name: 模板覆盖率报告（OPT-DOC-14，仅报告）
        continue-on-error: true
        run: bash scripts/feature-doc-coverage-report.sh

      - name: check-no-xapptool（已下线主机名防回流）
        # 2026-09-21：hive / hiveuser 服务器到期不续费，仓库内任何文件都不得再把
        # 已下线主机名当默认值或示例。命中数即本批待清清单。
        # 2026-10-26 判据收窄：裸域 xapptool.cn 及其在服子域（work/workapi/manage/manageapi/
        # developer）实测在线（HTTP 200，DNS→101.35.252.112），且官网客服浮标运行期依赖
        # work.xapptool.cn —— 它们不是死域，旧判据把活依赖判死正是 2026-10-23 删浮标事故的成因。
        # 现在只拦六个 hive* 主机名 + 旧服务器 IP（字面量见脚本里的 PATTERN；
        # 本注释刻意不写数字——本闸扫的就是字面量，写在这里等于自拦）。
        # 白名单 5 条（以脚本里的 WHITELIST 为准，别照本注释数）：设计文档 + 实施计划 +
        # 闸自身与它的反向测试（这四者的源码必须写出被拦模式，属自引用）+
        # GEO 站点归属用例（断言对象就是"那个死域不再算自家、不再享 A 级静态映射"）。
        run: bash scripts/check-no-xapptool.sh

      - name: check-no-xapptool 反向测试（证明上一步能红）
        # 恒绿的门等于没有门：注入 1 行违规必须让命中数 +1 且红因指向夹具，
        # 撤掉必须回到基线。已实测：把夹具加进白名单后本步会 BROKEN。
        run: bash scripts/check-no-xapptool.test.sh
