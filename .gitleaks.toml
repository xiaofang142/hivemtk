# gitleaks 配置 —— 只豁免写明用途的假凭据占位串（当前 3 条，逐条带取证）
#
# 立项原因（第二十六轮 A3）：拆 job 之后 gitleaks 第一次真正执行（此前它排在
# 恒定红的 golangci-lint 之后，被连带 skip 了五周），首跑即报
#   generic-api-key has detected secret for file .github/workflows/user-server-ci.yml at commit 42d24511
# 命中的是 user-server-ci.yml 里 `PLATFORM_JWT_SECRET: ci-jwt-secret-placeholder-32-chars-min-len-OK`
# —— 那是给测试期兜底用的**假**密钥（HS256 启动校验只查长度 ≥32），不是凭据。
#
# 为什么用 allowlist 而不是把门禁降回 continue-on-error：豁免范围必须精确到这串
# 占位值本身。任何其它 key（含未来误提交的真凭据、其它路径、其它规则）照旧命中。
#
# 本地实测（v8.24.3，与 CI 日志 `gitleaks version: 8.24.3` 同版本，同一命令
# `detect --log-opts=-1`）：
#   · 移走本文件 → `leaks found: 1`（与 CI 同一条命中，证明豁免确实是承重的）；
#   · 留本文件   → `no leaks found`；
#   · 隔离仓里种 `ghp_…` 真格式 key + 同一串占位值 → 只报 `github-pat`，占位值被吃掉，
#     证明 allowlist 没有顺手扩大半径。
# 反向测试的 canary 别选 AKIA…：gitleaks 内置 allowlist 本身就豁免了文档示例 key
# （AKIAIOSFODNN7EXAMPLE），拿它当探针会得到「门是死的」的错误结论。
[extend]
# 继承 gitleaks 内置规则集。漏了这一行的后果是「规则集变空 → 门恒绿」：
# 上面那个隔离仓实验里，只删这一段、allowlist 原样保留，同一提交立刻从
# `leaks found: 1` 变成 `no leaks found` —— 静默零覆盖，故本行必须有反向测试兜着。
useDefault = true

[allowlist]
description = "CI 占位 JWT 密钥（非凭据，仅为满足 user-server 启动期的 ≥32 字符校验）"
regexes = [
  '''ci-jwt-secret-placeholder-32-chars-min-len-OK''',
  # 渠道审计批F-4d / 批G-2b 的两条测试夹具（本轮 push 窗口实测命中，非凭据）：
  #   · `sticker_v3_n17`：fake 飞书 file_key，与同组夹具 `file_v3_n17_media/_audio/_folder`
  #     同一命名，只用于断言 sticker→[表情] 的 msg_type 映射，不参与任何鉴权。
  #   · `tt_g2b_margin_short`：假抖音服务的 app_key，只当缓存 map 的键用（与
  #     `tt_g2b_margin_long` 成对，用来区分「有效期够长→缓存」与「短于提前量→不缓存」）。
  # 两条都按**精确串值**豁免，不按路径、不按规则：同文件里出现任何其它 key-shaped 串照旧命中。
  # 取证见 docs/architecture/CHANNEL_INTEGRATION_AUDIT_2026-09.md §23.16。
  '''sticker_v3_n17''',
  '''tt_g2b_margin_short''',
  # 2026-09-22 第四十一轮按 push 窗口（b75c9939..1d222e77）实测新报的两条。逐值核过都不是凭据，
  # 沿用本表规矩：只豁这一串本身，不按文件、不按规则；同文件里出现任何其它 key 形状串照旧命中。
  #   · compliantToken（08578d1f 带来的 internal/pkg/db 启动期用例）＝ 64 位小写十六进制，是 sha256
  #     形状的【哈希】夹具，用作「令牌已是哈希态、启动清洗不该动它」的正例；哈希不可逆，不构成凭据面。
  #     同一 const 块里的 legacyPlainToken 是两个拼起来的 uuid 形状（长度 72），gitleaks 本来就不认
  #     ⇒ 这一刀的半径只有这一串。
  #   · 审计文档里 WebhookSecret: 后那串（4176e599 那一版段落，21 字符、sec 前缀、词干含 secret）
  #     是该段「<16 字符长度盲区」探针所引用的测试字面量，不是任何渠道下发的真值；那段自己写明
  #     「查无依据 ⇒ 从未进过豁免表」，此处把它补齐。
'''e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855''',
'''secret-abc-0123456789''',
]
