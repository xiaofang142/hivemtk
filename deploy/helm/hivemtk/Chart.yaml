# =============================================================================
# HiveMtk Helm Chart (OPT-MISC-01)
# 创建日期: 2026-08-16
# 适用范围: Kubernetes 1.24+ / Helm 3.10+
# 状态: 骨架 (skeleton), 仅覆盖 user-server Deployment + Service + Ingress
# 待办 (后续 OPT-MISC-04 ~ OPT-MISC-06 实施):
#   - platform-server chart
#   - user-web chart (Go embed 静态托管)
#   - PostgreSQL / Redis 依赖
#   - HPA / PDB / ServiceAccount
# =============================================================================
apiVersion: v2
name: hivemtk
description: |
  HiveMtk 用户端核心服务 (user-server) Helm Chart 骨架。
  包含 Deployment + Service + Ingress 三件套, 通过 values.yaml 注入配置。
type: application
version: 0.1.0    # Chart 版本 (SemVer)
appVersion: "0.1.0"  # 应用版本, 跟随 hivemtk/user-server 版本

# Chart 维护信息
#
# 刻意不带 email 字段：原来那行 sre@hivemtk.io 的域名根本不解析
# （实测 `dig +short hivemtk.io A` 返回空），留一个收不到信的邮箱比不留更坏。
maintainers:
  - name: HiveMtk SRE

# 关键字 (用于 helm search hub)
keywords:
  - hivemtk
  - user-server
  - marketing
  - chatbot
  - saas

# Chart 主页/源
#
# 三个地址都按"本批离线部署后的真实对外面"填：官网是 GitHub Pages 静态站，
# 源码是 Gitee 主仓 + GitHub 镜像。旧值 home: https://hivemtk.io 与
# sources: https://github.com/hivemtk/hivemtk 都是空的 ——
# 前者无 A 记录，后者 `gh api repos/hivemtk/hivemtk` 与 `gh api users/hivemtk` 均 404
# （那个 org 不存在）。
home: https://xiaofang142.github.io/hivemtk/
sources:
  - https://gitee.com/xhpmayun/hivemtk
  - https://github.com/xiaofang142/hivemtk

# 注解: 用于 artifact hub 分类
annotations:
  category: Application
  licenses: AGPL-3.0
