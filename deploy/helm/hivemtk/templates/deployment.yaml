{{- /* user-server Deployment skeleton (OPT-MISC-01) */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-user-server
  labels:
    app: {{ .Chart.Name }}
    component: user-server
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: user-server
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: user-server
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: user-server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: user-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              # 从 values 取而不是硬编码：模板里再写死一个端口，就等于把同一个数放两处，
              # 改 values.service.targetPort 时只有 Service 跟着变、容器口不动 —— 探针又哑掉。
              # 本 chart 自己的设计原则 2「所有可变项集中在 values.yaml」要的就是这一行不硬编码。
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- toYaml .Values.env | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.secrets.enabled }}
          volumeMounts:
            - name: run-secrets
              mountPath: {{ .Values.secrets.mountPath | default "/run/secrets" }}
              readOnly: true
          {{- end }}
      {{- if .Values.secrets.enabled }}
      volumes:
        # OPT-SEC-08: K8s Secret 以文件形态挂载到 /run/secrets，
        # 由 user-server 启动时的 secrets.LoadFiles 注入 env（已显式设置的 env 优先）。
        # Secret 内 key 命名需带 .txt / .env 扩展名（如 MASTER_KEY.txt、hivemtk.env），
        # 挂载后即为对应文件名供 fileloader 消费。
        - name: run-secrets
          secret:
            secretName: {{ .Values.secrets.name }}
            optional: true
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
