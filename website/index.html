    <!-- P3-5 内容安全策略（静态站无服务端响应头，meta 是 GitHub Pages 上唯一注入点）。
         放行面依据实测资源清单：
           - script-src https://work.xapptool.cn：网页客服浮标 SDK（body 尾部动态注入 marketing-chat-widget.iife.js）
           - frame-src  https://work.xapptool.cn：SDK 聊天窗 iframe（/chat/embed/:channel）
           - 字体经 @fontsource 打入 dist（'self'），微信二维码在 public/（'self'），站内无其他外域资源
           - connect-src 收死 'self'：SDK 宿主侧脚本不发网络请求，WS/API 都发生在 iframe 文档内，
             由 iframe 自身的文档源管辖，宿主 CSP 不约束
           - frame-ancestors 不写：该指令经 <meta> 交付会被浏览器忽略（仅 HTTP 响应头有效），
             GitHub Pages 也无法自定义响应头，写进 meta 只会每屏刷一条控制台告警 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://work.xapptool.cn; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-src https://work.xapptool.cn" />

    <!-- canonical + hreflang alternate（canonical 由 router/index.js 的 afterEach 按路由覆盖）
         这里的站点前缀必须与 vite.config.js 的 SITE_BASE（'/hivemtk/'）一致：
         站点托管在 GitHub Pages 的项目子路径下，写成域名根会让规范链接指向 404。
         ?lang= 由 src/i18n/locale.js 在首屏读取，与 hreflang 声明的语言版本对应。 -->
    <link rel="canonical" href="https://xapptool.cn/" />
    <link rel="alternate" hreflang="zh" href="https://xapptool.cn/?lang=zh" />
    <link rel="alternate" hreflang="en" href="https://xapptool.cn/?lang=en" />
    <link rel="alternate" hreflang="ja" href="https://xapptool.cn/?lang=ja" />

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- HiveMTK 网页客服浮标（右下角）— 接 work.xapptool.cn 的 web 渠道智能体 -->
    <script>
      // SDK auto-init 会读取此全局配置创建唯一实例（避免 onload 重复 new 出双浮标）
      window.MarketingChatWidgetConfig = {
        appKey: 'ak_79Zw7HWzR5wNUnNn6QMnkw8B',
        apiBaseURL: 'https://work.xapptool.cn',
        title: 'HiveMTK 在线客服',
        welcome: '您好！我是 HiveMTK 智能客服，请问有什么可以帮您？',
        color: '#1989fa',
        position: 'bottom-right'
      };
      (function() {
        var s = document.createElement('script');
        // 路径必须是 /embed/（work.xapptool.cn 的该前缀反代到 user-server 的 SDK 静态目录）；
        // 旧值 /embed-sdk-dist/ 在 nginx 与 user-server 两侧都没有对应产物，浮标从未加载出来
        s.src = 'https://work.xapptool.cn/embed/marketing-chat-widget.iife.js';
        s.async = true;
        s.onerror = function() {
          console.error('[客服浮标] SDK 加载失败：work.xapptool.cn/embed/marketing-chat-widget.iife.js');
        };
        document.head.appendChild(s);
      })();
    </script>
